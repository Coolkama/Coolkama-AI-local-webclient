                   :'The diagram has been created in this chat. Download its SVG, PNG or editable Mermaid source below.';
                 paint();answered=true;break;
               }
               throw limitError;
             }
           }
        }
        if(output.trim()&&continuationPrefix)
          rememberContinuationPrefix(assistantId,continuationPrefix);
        // Device-side models are limited by memory and some Android drivers
        // lose their WebGPU device on repeated completions. Do not launch an
        // unrequested second generation when a local response reaches its cap.
        if(provider!=='browser'&&settings.autoContinue!==false&&autoEligible&&output.trim()&&
            ['output_limit','unfinished_code'].includes(incompleteReason)){
          const continueRule='Continue your immediately preceding assistant answer from its exact final character. '+
            'If the final line is an incomplete expression or statement, finish that very line first. '+
            'Do not repeat code, redeclare functions or variables already written, restart sections, or add introductions. '+
            'Do not reopen its Markdown code fence; close the existing fence once the code is complete. Do not invoke any tools.';
          while(autoRounds<MAX_AUTO_CONTINUATIONS){
            if(controller.signal.aborted)throw new DOMException('Stopped','AbortError');
            const previous=output;
            const nextRound=autoRounds+1;
            const previousFence=unclosedCodeFence(previous);
            const cachedRequest=cachedPrefillRequest(provider,config,continuationPrefix,previous);
            const continuationPlan=cachedRequest||buildContinuationMessages({
              provider,profile:{...config,groqPrefill:false},history:messages,previous,
              instruction:continueRule,dateContext:requestDateContext,
              followup:'Continue exactly where the preceding answer ended. '+
                (previousFence?'It ends inside a '+(previousFence.language||'code')+' Markdown fence. ':'')+
                'Reply with only the remaining text, no repetition.'
            });
            const windowed=cachedRequest
              ?{messages:cachedRequest.messages,stats:cachedRequest.stats}
              :rollContextMessages(continuationPlan.messages,config);
            if(continuationProtocol(provider,config)==='assistant-prefill'&&!cachedRequest)
              diagLog('normal','prefill-cache-fallback',{
                reason:continuationPrefix?'input-budget-exceeded':'original-request-unavailable',
                usedProtocol:'followup-turn'
              },{...diagCtx,round:autoRounds+1});
            patchAssistant({contextWindow:windowed.stats,searchStatus:null});
            autoRounds++;
            const ctx={...diagCtx,round:autoRounds,autoContinuation:true};
            diagLog('normal','auto-continuation-start',{
              attempt:autoRounds,priorChars:previous.length,
              maxAttempts:MAX_AUTO_CONTINUATIONS,
              protocol:continuationPlan.protocol,
              hasOpenFence:!!previousFence,...windowed.stats
            },ctx);
            const joiner=createContinuationJoiner(previous,text=>{
              output=text;
              if(performance.now()-lastPaint>45){paint();lastPaint=performance.now();}
            });
            try{
              const response=await streamChatWithRateWait({
                provider,profile:config,temperature:settings.temperature,
                messages:windowed.messages,signal:controller.signal,
                onToken:part=>joiner.push(part),
                onSources:()=>{},
                toolsEnabled:cachedRequest?cachedRequest.prefix.toolsEnabled:false,
                toolDefinitions:cachedRequest?cachedRequest.prefix.toolDefinitions:WEB_SEARCH_TOOLS,
                finalOnly:cachedRequest?cachedRequest.prefix.finalOnly:false,
                trace:ctx
              },()=>setUsageRevision(v=>v+1));
              if(response.toolCalls?.length||/<dots_function_call>/i.test(response.content))
                throw new Error('Model generated a tool call instead of finishing text.');
              const joined=joiner.finish();
              output=joined.content;
              if(!joined.addedChars)throw new Error('Model returned no new continuation text.');
              const limit=['length','max_tokens','model_length'].includes(response.finishReason);
              const openFence=!!unclosedCodeFence(output);
              incomplete=limit||openFence;
              incompleteReason=limit?'output_limit':openFence?'unfinished_code':null;
              diagLog('normal','continuation-alignment',{
                attempt:autoRounds,overlapChars:joined.overlap,
                bufferedChars:joined.bufferedChars,addedChars:joined.addedChars
              },ctx);
              diagLog('normal','auto-continuation-finished',{
                attempt:autoRounds,addedChars:joined.addedChars,
                totalChars:output.length,finishReason:response.finishReason,
                stillIncomplete:incomplete
              },ctx);
              if(!incomplete)break;
            }catch(initialError){
              let error=initialError,retriedPrefill=false;
              if(cachedRequest&&groqPrefillRetryable(error)&&!controller.signal.aborted&&
                  autoRounds<MAX_AUTO_CONTINUATIONS){
                retriedPrefill=true;
                // The normal follow-up is a second, separately counted model
                // request and must consume one of the six allowed attempts.
                autoRounds++;
                // Prefill is not reliably a long-output resume for every model.
                // Retry a single conventional follow-up, preserving original code.
                output=previous;
                continuationPrefix=null;
                continuationRequestPrefixes.delete(assistantId);
                diagLog('normal','prefill-failed-retrying-followup',{
                  message:String(error.message||error),automatic:true
                },ctx);
                try{
                  const fallback=await retryPrefillAsFollowup({
                    provider,profile:config,history:messages,previous,
                    instruction:continueRule,
                    followup:'Continue exactly at the preceding answer final character. Supply only the missing suffix, no repetition.',
                    dateContext:requestDateContext,signal:controller.signal,
                    temperature:settings.temperature,trace:ctx,
                    onChange:text=>{output=text;if(performance.now()-lastPaint>45){paint();lastPaint=performance.now();}},
                    onReserved:()=>setUsageRevision(v=>v+1)
                  });
                  output=fallback.joined.content;
                  const limited=['length','max_tokens','model_length'].includes(fallback.response.finishReason);
                  const openFence=!!unclosedCodeFence(output);
                  incomplete=limited||openFence;
                  incompleteReason=limited?'output_limit':openFence?'unfinished_code':null;
                  continuationFailure=null;
                  diagLog('normal','prefill-followup-recovered',{
                    automatic:true,addedChars:fallback.joined.addedChars,stillIncomplete:incomplete
                  },ctx);
                  if(!incomplete)break;
                  continue;
                }catch(fallbackError){error=fallbackError;}
              }
              if(error.name==='AbortError')throw error;
              if(!retriedPrefill)output=joiner.content;
              incomplete=true;
              const alignedProblem=/restarted an earlier section|instead of continuing|unfinished JavaScript|unfinished CSS/i.test(error.message||'');
              incompleteReason=alignedProblem?'continuation_misaligned':
                unclosedCodeFence(output)?'unfinished_code':'output_limit';
              continuationFailure=error.message||String(error);
              diagLog('normal','auto-continuation-stopped',{
                attempt:autoRounds,error:continuationFailure,preservedChars:output.length
              },ctx);
              break;
            }
          }
        }
      }
      // A natural model stop is not proof that an HTML/JS artefact is valid.
      // Check syntax without executing user-generated JavaScript.
      const codeIssue=!incomplete?generatedHtmlSyntaxIssue(output):null;
      if(codeIssue){
        incomplete=true;
        incompleteReason='invalid_code';
        continuationFailure=codeIssue;
        diagLog('normal','generated-code-invalid',{message:codeIssue,chars:output.length},diagCtx);
      }
      paint();
      const citationAudit=searchMode&&!incomplete?auditAnswerCitations(output,allSources):null;
      patchAssistant({content:output||(diagramCreated?'Diagram created below. You can ask me to revise it.':imageCallsUsed?(imageConsentNeeded?'Image generation needs your privacy acknowledgement below.':'Image request handed to your browser. The image will appear here when ready.'):'(The model returned no text.)'),status:incomplete?'incomplete':'done',incompleteReason,continuationError:continuationFailure,searchStatus:null,searchingWeb:false,reasoningProgress:null,citationAudit});
      if(citationAudit){
        diagLog('normal','citation-audit',{retrievedSources:citationAudit.retrievedSources,citedUrls:citationAudit.citedUrls,numericCitations:citationAudit.numericCitations,unverifiedUrls:citationAudit.unverifiedUrls.length,invalidRefs:citationAudit.invalidRefs,noTraceableCitations:citationAudit.noTraceableCitations},diagCtx);
        diagLog('detailed','citation-audit-details',citationAudit,diagCtx);
      }
      diagLog('normal','turn-finished',{provider,outputChars:output.length,webSearches:searchLog.length,sourceCount:allSources.length,incomplete,incompleteReason},diagCtx);
      diagLog('full','final-answer',{text:output},diagCtx);
    } catch(e) {
      const stopped=controller.signal.aborted;
      if(output.trim())diagLog('full','turn-interrupted-visible-response',{
        text:output,error:String(e?.message||e),stopped
      },diagCtx);
      diagLog('normal',stopped?'turn-aborted':'turn-error',{message:stopped?'User cancelled':(e.message||String(e)),type:e.name||'Error'},diagCtx);
      if(!stopped&&provider==='groq'&&isGroqRateLimit(e)&&allSources.length&&!output.trim()){
        // The model may have exhausted its free token budget after collecting
        // legitimate evidence. Preserve those links instead of an empty reply.
        output=sourceOnlyAnswer(allSources,
          'Groq hit its free token-per-minute limit before it could complete a summary. The source links below remain available; retry once the provider limit refreshes.');
        patchAssistant({content:output,status:'incomplete',incompleteReason:'provider_rate_limit',
          searchStatus:null,searchingWeb:false,reasoningProgress:null,error:null});
        diagLog('normal','groq-evidence-preserved-after-rate-limit',{sourceCount:allSources.length},diagCtx);
      }else{
        patchAssistant({content:output,status:stopped?'stopped':'error',searchStatus:null,searchingWeb:false,reasoningProgress:null,error:stopped?'':(e.message||String(e))});
      }
      if(!stopped&&e instanceof TypeError)setNotice('Network/CORS error. Check provider URL, CORS policy and browser console.');
    } finally {
       // Stop stays connected to AI Horde while it runs after the model finishes.
       if(imageTasks.length)await Promise.allSettled(imageTasks);
       workRef.current=null;setBusy(null);
    }
  }
  const sorted=useMemo(()=>[...chats].sort((a,b)=>(b.updatedAt||b.createdAt)-(a.updatedAt||a.createdAt)),[chats]);
  return <div className="app-height matrix-ui flex overflow-hidden text-slate-100">
    {drawer&&<div className="fixed inset-0 z-20 bg-black/65 md:hidden" onClick={()=>setDrawer(false)}/>}
    <aside className={`fixed md:relative inset-y-0 left-0 z-30 w-[min(84vw,310px)] md:w-[280px] shrink-0 flex flex-col border-r border-slate-800 bg-slate-900 matrix-sidebar safe-top safe-bottom transform transition-transform duration-200 ${drawer?'translate-x-0':'-translate-x-full md:translate-x-0'}`}>
      <div className="px-4 pt-5 pb-4 flex items-center justify-between">
        <div className="flex items-center gap-2.5 min-w-0">
          <div className="w-12 h-12 shrink-0 rounded-xl border border-emerald-500/50 bg-[#06140e] grid place-items-center overflow-hidden shadow-lg shadow-emerald-600/20">
            {SIDEBAR_ROBOT_IMAGE
              ?<img src={SIDEBAR_ROBOT_IMAGE} alt="Tight Arse AI grumpy robot mascot" width="48" height="48" className="block w-full h-full object-contain p-0.5"/>
              :<Icon name="spark" size={22}/>}
          </div>
          <div className="min-w-0">
            <div className="font-bold text-sm leading-5 text-lime-100">Tight Arse AI</div>
            <div className="text-[10px] leading-4 text-emerald-200/80">Maximum intelligence · Minimum spend</div>
          </div>
        </div>
        <button className="md:hidden text-slate-400 p-2" onClick={()=>setDrawer(false)} aria-label="Close drawer"><Icon name="x"/></button>
      </div>
      <button onClick={addChat} className="btn btn-primary mx-4 mb-5"><Icon name="plus" size={16}/> New conversation</button>
      <div className="px-5 text-[10px] uppercase tracking-[.2em] font-semibold text-slate-500 mb-2">Conversations · {chats.length}</div>
      <div className="flex-1 overflow-y-auto thin-scroll px-2 space-y-1">{sorted.map(c=><div key={c.id} className={`group matrix-conversation ${c.id===active?.id?'active':''} flex items-center rounded-xl border ${c.id===active?.id?'bg-lime-500/10 border-lime-500/30':'border-transparent hover:bg-slate-800/70'}`}>
        <button onClick={()=>changeChat(c.id)} className="text-left flex-1 min-w-0 px-3 py-3 flex items-center gap-2.5"><Icon name="message" size={16} className={c.id===active?.id?'text-lime-400':'text-slate-500'}/><span className="truncate text-sm">{c.title}</span>{busy===c.id&&<span className="shrink-0 w-1.5 h-1.5 bg-lime-400 rounded-full stream-dot"/>}</button>
        <button onClick={()=>deleteChat(c.id)} className="p-2 mr-1 text-slate-500 hover:text-rose-400" title="Delete conversation" aria-label={`Delete ${c.title}`}><Icon name="trash" size={15}/></button>
      </div>)}</div>
      <div className="m-3 p-3 rounded-xl bg-slate-950/60 border border-slate-800"><div className="flex items-center gap-2 text-xs text-slate-300"><span className="w-2 h-2 bg-emerald-400 rounded-full"/> Local browser storage</div><p className="text-[11px] text-slate-500 mt-1">No account or backend required.</p><p className="mt-1 text-[10px] text-slate-500 font-mono" title="App version — check this to verify your published index.html is current">Build: {APP_BUILD}</p></div>
    </aside>
    <main className="matrix-main flex-1 min-w-0 min-h-0 flex flex-col bg-slate-950">
      <header className="matrix-header safe-top shrink-0 border-b border-slate-800/80 bg-slate-950/90 backdrop-blur">
        <div className="h-16 px-3 sm:px-5 flex items-center gap-2 sm:gap-4">
          <button className="md:hidden p-2 text-slate-300" onClick={()=>setDrawer(true)} aria-label="Open conversations"><Icon name="menu" size={22}/></button>
          <div className="flex-1 min-w-0"><h1 className="text-sm sm:text-base font-semibold truncate">{active?.title||'New conversation'}</h1><p className="text-[11px] text-emerald-300 truncate">{imageMode?'FREE IMAGE · AI Horde volunteer workers':'FREE ONLY · '+(profile.model||'Choose a model')}</p></div>
          <button className="flex items-center gap-1.5 sm:gap-2 px-2 sm:px-3 py-1.5 rounded-full bg-slate-900 border border-slate-800 text-[10px] sm:text-xs text-slate-300 max-w-[105px] sm:max-w-none" onClick={()=>setSettingsOpen(true)}><span className={`w-1.5 h-1.5 rounded-full ${imageMode?'bg-lime-400':settings.provider==='demo'?'bg-amber-400':'bg-emerald-400'}`}/>{imageMode?'AI Horde':PROVIDERS[settings.provider].name}</button>
          <button className="btn btn-soft !p-2.5" title="Diagnostics" aria-label="Diagnostics" onClick={()=>setDiagnosticsOpen(true)}><Icon name="activity" size={19}/></button>
          <button className="btn btn-soft !p-2.5" title="Settings" aria-label="Settings" onClick={()=>setSettingsOpen(true)}><Icon name="settings" size={19}/></button>
        </div>
      </header>
      <div className="px-3 py-1.5 flex justify-between items-center gap-2 border-b border-emerald-800/50 bg-emerald-950/40 text-[10px] sm:text-xs">
        <span className="text-emerald-200 font-bold">FREE ONLY · No paid models or search</span>
        <button className="text-amber-200 underline shrink-0" onClick={()=>setSettingsOpen(true)}>Usage limits / billing warning</button>
      </div>
      {settings.provider==='browser'&&!imageMode&&<div className="px-3 py-2 border-b border-emerald-800/50 bg-[#081b11] text-xs">
        <div className="max-w-4xl mx-auto flex items-center gap-2">
          <Icon name="layers" size={16} className="text-lime-400"/>
          <span className="flex-1 min-w-0 text-emerald-200 truncate" title={browserProgress.text}>{browserProgress.phase==='loading'?'Loading local model: ':browserProgress.phase==='generating'?'Generating on your GPU: ':'On-device inference: '}{browserProgress.text}</span>
          <button type="button" className="underline text-lime-300 shrink-0" onClick={()=>setSettingsOpen(true)}>Model settings</button>
        </div>
        {browserProgress.phase==='loading'&&<div className="max-w-4xl mx-auto h-1.5 bg-slate-800 rounded-full overflow-hidden mt-2"><div className="h-full bg-lime-400" style={{width:Math.round(browserProgress.progress*100)+'%'}}/></div>}
        {settings.search.enabled&&<div className="max-w-4xl mx-auto text-amber-200 mt-1">Turn off the globe / Web search to chat locally.</div>}
      </div>}
      <div className="relative flex-1 min-h-0">
      <section ref={chatScrollRef} onScroll={onChatScroll} className="chat-scroll matrix-chat h-full overflow-y-auto thin-scroll" aria-label="Chat messages">
        <div className="max-w-4xl mx-auto px-4 sm:px-8 py-6 md:py-8">
          {!active?.messages.length ? <div className="matrix-hero flex flex-col items-center justify-center text-center min-h-[48dvh]">
            <div className="w-16 h-16 rounded-3xl bg-gradient-to-br from-lime-500/30 to-emerald-600/10 border border-lime-500/30 grid place-items-center text-lime-300 mb-5">{settings.provider==='browser'?<Icon name="layers" size={30}/>:<Icon name="spark" size={30}/>}</div>
            <h2 className="text-2xl sm:text-3xl font-bold tracking-tight text-white">What shall we work on?</h2>
            <p className="text-slate-400 text-sm max-w-sm mt-3 leading-6">{settings.provider==='browser'?'This model generates text on your device using WebGPU. First use requires a large download. No API key or remote inference. Web search and image understanding are not supported here.':'Chat with free and local AI models. Search the web, attach images, PDFs or code, and save generated snippets.'}</p>
            <div className="flex gap-2 flex-wrap justify-center mt-6">{['Write a Python script','Explain a PDF','Create a React component'].map(s=><button key={s} className="btn btn-soft border border-slate-700/70 !text-xs" onClick={()=>{setDraft(s);inputRef.current?.focus();}}>{s}</button>)}</div>
            {!['demo','ollama','browser'].includes(settings.provider)&&(!profile.key?.trim()||!settings.freeTierConfirmed?.[settings.provider])&&<button type="button" onClick={()=>setWizardOpen(true)} className="btn btn-primary mt-5">Guided free AI setup · with the grumpy robot</button>}
             <p className="text-xs text-slate-500 mt-6">Currently selected: <button className="text-lime-300 underline" onClick={()=>setSettingsOpen(true)}>{PROVIDERS[settings.provider].name}</button></p>
          </div> : <div className="space-y-6">{active.messages.map(m=><Message key={m.id} message={m}
              streaming={busy===active.id&&m.role==='assistant'&&m.status==='streaming'}
              onContinue={continueResponse}
              onRetry={retryResponse}
              canRetry={!busy&&!reading&&m.role==='assistant'&&m.status!=='streaming'}
              onSpeak={speakResponse}
              isSpeaking={speakingMessageId===m.id&&active.id===activeId}
               onApproveImage={approveModelImage}
               canApproveImage={!busy&&!reading&&!!m.imageConsentRequest}
              canContinue={!busy&&!reading&&m.role==='assistant'&&
                ((m.status==='incomplete'&&
                  (m.incompleteReason==='output_limit'||m.incompleteReason==='unfinished_code'||m.incompleteReason==='continuation_misaligned'))||
                 (m.status==='done'&&!!unclosedCodeFence(m.content)))&&
                m.id===active.messages[active.messages.length-1]?.id&&
                (Number(m.continuations)||0)<MAX_MANUAL_CONTINUATIONS}/>)}</div>}
        </div>
      </section>
      {showLatest&&<button type="button" onClick={jumpToLatest} className="absolute bottom-4 right-4 sm:right-8 z-10 flex items-center gap-2 rounded-full bg-lime-600 hover:bg-lime-500 border border-lime-400 px-3 py-2 text-xs font-semibold text-white shadow-xl" aria-label="Jump to latest message"><Icon name="arrow-down" size={15}/> Latest</button>}
      </div>
      <div className="glass matrix-composer shrink-0 border-t border-slate-800 safe-bottom px-3 pt-3 sm:px-6">
        <div className="max-w-4xl mx-auto">
          {notice&&<div className="flex gap-2 items-start justify-between bg-amber-500/10 text-amber-200 border border-amber-500/30 rounded-xl px-3 py-2 mb-2 text-xs"><span>{notice}</span><button onClick={()=>setNotice('')} aria-label="Dismiss"><Icon name="x" size={14}/></button></div>}
          {attachments.length>0&&<div className="flex gap-2 overflow-x-auto thin-scroll pb-2">{attachments.map(a=><div key={a.id} className="flex shrink-0 items-center gap-2 max-w-52 border border-slate-700 rounded-lg p-1.5 bg-slate-900">{a.type==='image'?<img src={a.dataUrl} className="h-9 w-9 object-cover rounded" alt={a.name}/>:<Icon name="file" size={19} className="text-lime-400"/>}<span className="text-[11px] truncate max-w-28" title={a.name}>{a.name}</span><button className="text-slate-400 hover:text-white" aria-label={`Remove ${a.name}`} onClick={()=>setAttachments(xs=>xs.filter(x=>x.id!==a.id))}><Icon name="x" size={14}/></button></div>)}</div>}
          {imageMode&&<div className="mb-2 rounded-xl px-3 py-2 border border-lime-700/50 bg-emerald-950/60 text-xs text-lime-100">
            <span className="font-semibold">Image mode · AI Horde (anonymous by default)</span>
            <span className="ml-2 text-slate-400">Volunteer workers receive your prompt. Images can take minutes. No Tavily or text-model request.</span>
            {!settings.imageHorde?.acknowledged&&<label className="flex items-start gap-2 mt-2 text-amber-200">
              <input type="checkbox" checked={false} onChange={e=>{if(e.target.checked)setSettings(v=>({...v,imageHorde:{...v.imageHorde,acknowledged:true}}));}}
                className="mt-0.5 accent-lime-500"/>
              <span>I understand anonymous generations may be shared with LAION and won't submit private prompts.</span>
            </label>}
          </div>}
          <div className="matrix-composer-input flex items-end gap-1 sm:gap-2 rounded-2xl bg-slate-900 border border-slate-700 focus-within:border-lime-500/80 p-2 shadow-xl shadow-black/20">
            <input type="file" ref={fileRef} className="hidden" multiple accept="image/png,image/jpeg,image/webp,image/gif,.pdf,.txt,.md,.json,.jsonl,.js,.jsx,.ts,.tsx,.py,.cs,.html,.css,.xml,.csv,.yaml,.yml,.java,.go,.rs,.sql,.sh,.ps1,.cpp,.c,.log,.toml,.ini,.conf,.kt,.dart" onChange={e=>attachFiles([...e.target.files])}/>
            <button className="shrink-0 h-10 w-10 grid place-items-center rounded-xl text-slate-400 hover:bg-slate-800 hover:text-lime-300 disabled:opacity-40" disabled={reading} title="Attach images, PDF, text or code" aria-label="Add attachment" onClick={()=>fileRef.current?.click()}><Icon name="paperclip" size={20}/></button>
            <button className="search-toggle" type="button" disabled={imageMode}
              aria-pressed={webEnabled&&!imageMode} aria-label={imageMode?'Web search unavailable during image generation':webEnabled?'Disable web search':'Enable web search'}
              title={imageMode?'Image generation does not use web search':webEnabled?'Web search ON · Tap to disable':'Web search OFF · Tap to enable'}
              onClick={()=>setSettings(current=>({...current,search:{...current.search,enabled:!current.search.enabled}}))}><Icon name="globe" size={19}/></button>
            <button type="button" className="search-toggle" aria-pressed={imageMode} disabled={!!busy||reading}
              aria-label={imageMode?'Switch to text chat':'Generate image with AI Horde'} title={imageMode?'Image mode ON · Tap for text chat':'Generate image (FREE AI Horde)'}
              onClick={()=>setImageMode(v=>!v)}><Icon name="image" size={19}/></button>
            <textarea ref={inputRef} rows="1" className="composer-text thin-scroll w-full min-w-0 bg-transparent px-1.5 py-2.5 text-sm leading-6 outline-none placeholder:text-slate-500" value={draft} onChange={e=>{setDraft(e.target.value);e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,170)+'px';}} placeholder={reading?'Reading attachment…':imageMode?'Describe an image to generate…':'Ask anything…'} onKeyDown={e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.nativeEvent.isComposing){e.preventDefault();send();}}}/>
            {busy?<button className="btn btn-soft !p-2.5 shrink-0 !bg-rose-500/20 !text-rose-300" title="Stop generation" aria-label="Stop generation" onClick={stop}><Icon name="stop" size={20}/></button>:<button className="btn btn-primary !p-2.5 shrink-0" title={imageMode?'Generate image':'Send'} aria-label={imageMode?'Generate image':'Send message'} disabled={reading||(!draft.trim()&&!attachments.length)} onClick={send}><Icon name={imageMode?'image':'send'} size={20}/></button>}
          </div>
          <p className="text-center text-[10px] text-slate-500 mt-2">{reading?'Extracting file contents…':busy?(imageMode?'AI Horde image job · Stop to cancel':'Generating · Stop to cancel'):imageMode?'AI Horde volunteer image generation · '+counted('horde').day+'/20 image requests today':webEnabled?'Web on · Tavily '+counted('tavily').month+'/900 free-use browser counter':'Web off · Free-only browser counters are not billing guarantees'}</p>
        </div>
      </div>
    </main>
    {settingsOpen&&<Settings value={settings} onChange={setSettings} onClose={()=>setSettingsOpen(false)} onOpenDiagnostics={()=>{setSettingsOpen(false);setDiagnosticsOpen(true);}} onOpenWizard={()=>{setSettingsOpen(false);setWizardOpen(true);}}/>}
    {wizardOpen&&<ProviderSetupWizard value={settings} onChange={setSettings} onClose={dismissWizard} onUsage={()=>setUsageRevision(v=>v+1)}/>}
    {diagnosticsOpen&&<DiagnosticsPanel chatId={active?.id||activeId} onClose={()=>setDiagnosticsOpen(false)}/>}
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
