const safeWebUrl = value => {
  try { const u=new URL(String(value)); return ['http:','https:'].includes(u.protocol)?u.href:null; }
  catch { return null; }
};
function searchRoute(provider, settings) {

  if(!settings.search.tavilyKey.trim())throw new Error('FREE-ONLY STOP: Add a Tavily FREE-plan API key to use web search.');
  if(!settings.search.tavilyFreeConfirmed)throw new Error('FREE-ONLY STOP: Confirm the Tavily account is on the no-card FREE Researcher plan, not pay-as-you-go.');

          <div><label className="block text-xs font-semibold text-slate-300 mb-2">Tavily FREE Researcher API key</label><div className="relative"><input className="field pr-12" type={showSearchKey?'text':'password'} autoComplete="off" placeholder="tvly-... (free plan only)" value={value.search.tavilyKey} onChange={e=>patchSearch({tavilyKey:e.target.value,tavilyFreeConfirmed:false})}/><button className="absolute right-3 top-2.5 text-slate-400" aria-label="Show or hide Tavily key" onClick={()=>setShowSearchKey(v=>!v)}><Icon name={showSearchKey?'eyeoff':'eye'}/></button></div><p className="text-xs text-slate-400 mt-2">Free plan = <strong>1,000 credits per calendar month</strong>, then search stops; no payment card required. <a className="text-indigo-300 underline" target="_blank" rel="noopener noreferrer" href="https://app.tavily.com/">Create free key</a> · <a className="text-indigo-300 underline" target="_blank" rel="noopener noreferrer" href="https://www.tavily.com/pricing">Official quotas</a>.</p></div>
          <label className="flex gap-2 items-start rounded-xl border border-amber-700/60 bg-amber-950/20 p-3 text-xs leading-5 text-amber-100"><input type="checkbox" className="h-4 w-4 mt-1 accent-emerald-500 shrink-0" checked={!!value.search.tavilyFreeConfirmed} onChange={e=>patchSearch({tavilyFreeConfirmed:e.target.checked})}/><span><strong>Required for search:</strong> My Tavily key is on the free, no-credit-card Researcher plan. NOT a paid, subscription or pay-as-you-go account.</span></label>
          <div><label className="block text-xs font-semibold text-slate-300 mb-2">Sources per basic search (1 request)</label><select className="field" value={value.search.maxResults} onChange={e=>patchSearch({maxResults:Number(e.target.value)})}>{[2,3,4,5,8,10].map(n=><option key={n} value={n}>{n} sources</option>)}</select></div>
          <Quota provider="tavily"/>
          <p className="text-[11px] text-amber-200 leading-5">{FREE_DETAILS.tavily} Search never upgrades itself. Web snippets are sent to the selected model to answer your question.</p>
        </div>
        <div><div className="flex justify-between mb-2"><label className="text-xs font-semibold text-slate-300">Temperature</label><span className="text-xs text-indigo-300 font-mono">{Number(value.temperature).toFixed(2)}</span></div><input type="range" min="0" max="2" step="0.05" className="w-full accent-indigo-500" value={value.temperature} onChange={e=>patch({temperature:Number(e.target.value)})}/></div>
        <div><label className="block text-xs font-semibold text-slate-300 mb-2">System instruction</label><textarea className="field min-h-24" value={value.systemPrompt} onChange={e=>patch({systemPrompt:e.target.value})}/></div>
        <p className="text-xs leading-5 text-amber-200/80 border-t border-slate-800 pt-4"><strong>Privacy:</strong> API keys, images and messages live in localStorage, which is not encrypted. Browser extensions and scripts running on this page can access them. Use a trusted device and restricted keys; do not enter secrets or confidential documents into public free models. Browsers can block cross-origin requests or HTTP endpoints on HTTPS pages.</p>
      </div>
      <div className="p-4 border-t border-slate-800"><button className="btn btn-primary w-full" onClick={onClose}>Done</button></div>
    </div>
  </div>;
}
function App() {
  const [initial] = useState(readSaved);
  const [chats,setChats]=useState(initial.chats.length?initial.chats:[newChat()]);
  const [activeId,setActiveId]=useState(initial.chats.some(c=>c.id===initial.activeId)?initial.activeId:(initial.chats[0]?.id || null));
  const [settings,setSettings]=useState(initial.settings);
  const [drawer,setDrawer]=useState(false),[settingsOpen,setSettingsOpen]=useState(false);
  const [draft,setDraft]=useState(''),[attachments,setAttachments]=useState([]),[busy,setBusy]=useState(null),[notice,setNotice]=useState('');
  const [reading,setReading]=useState(false);
  const [usageRevision,setUsageRevision]=useState(0);
  const inputRef=useRef(null),fileRef=useRef(null),bottomRef=useRef(null),workRef=useRef(null);
  const active=chats.find(c=>c.id===activeId)||chats[0];
  const profile=settings.profiles[settings.provider];
  const webEnabled=!!settings.search.enabled;
  useEffect(()=>{
    try {localStorage.setItem(STORAGE_KEY,JSON.stringify({chats,activeId:active?.id||activeId,settings}));}
    catch(e) {setNotice('Browser storage is full or unavailable. Large images may not survive a reload. Delete older chats or use smaller images.');}
  },[chats,activeId,settings]);
  useEffect(()=>{bottomRef.current?.scrollIntoView({behavior:'smooth',block:'end'});},[active?.messages,activeId]);
  useEffect(()=>{if(!draft&&inputRef.current)inputRef.current.style.height='auto';},[draft]);
  useEffect(()=>{if(notice){const id=setTimeout(()=>setNotice(''),7000);return()=>clearTimeout(id);}},[notice]);
  function addChat(){const c=newChat();setChats(old=>[c,...old]);setActiveId(c.id);setDraft('');setAttachments([]);setDrawer(false);}
  function changeChat(id){setActiveId(id);setDrawer(false);setDraft('');setAttachments([]);}
  function deleteChat(id){
    if(!window.confirm('Delete this conversation permanently?'))return;
    if(workRef.current?.id===id) workRef.current.controller.abort();
    const next=chats.filter(c=>c.id!==id);
    if(next.length) {setChats(next);if(activeId===id)setActiveId(next[0].id);}
    else {const c=newChat();setChats([c]);setActiveId(c.id);}
  }
  function patchChat(id, updater) {setChats(old=>old.map(c=>c.id===id?updater(c):c));}
  async function attachFiles(files) {
    if(!files.length)return;
    setReading(true);
    const added=[];
    try {
      for(const f of files) {
        if(attachments.length+added.length>=6) throw new Error('Maximum 6 attachments per message.');
        if(f.size>8*1024*1024) throw new Error(`${f.name} is over 8 MB.`);
        added.push(f.type.startsWith('image/')?await imageAttachment(f):await documentAttachment(f));
      }
      setAttachments(a=>[...a,...added]);
    } catch(e) {setNotice(e.message);if(added.length)setAttachments(a=>[...a,...added]);}
    finally {setReading(false);if(fileRef.current)fileRef.current.value='';}
  }
  function stop(){workRef.current?.controller.abort();}
  async function send() {
    if(busy||workRef.current||reading||(!draft.trim()&&!attachments.length)||!active)return;
    const provider=settings.provider,config={...settings.profiles[provider]};
    if(provider!=='demo'&&provider!=='ollama'&&!config.key.trim()) {setNotice('Add an API key in Settings, or select Test Mode.');setSettingsOpen(true);return;}
    if(!config.model.trim()||(provider!=='demo'&&!config.url.trim())) {setNotice('Choose a free model in Settings.');setSettingsOpen(true);return;}
    try{enforceFreeOnly(provider,config,settings);if(LOCAL_CAPS[provider])checkCap(provider);}
    catch(e){setNotice(e.message);setSettingsOpen(true);return;}
    let searchMode=null;
    try {searchMode=searchRoute(provider,settings);} catch(e){setNotice(e.message);setSettingsOpen(true);return;}
    const chatId=active.id,content=draft.trim(),files=[...attachments];
    if(searchMode==='tavily'&&!content){setNotice('Enter a question to search the web, or turn Web off.');return;}
    const userMsg={id:uid(),role:'user',content,attachments:files,webSearch:!!searchMode,createdAt:Date.now()};
    const assistantId=uid(),assistantMsg={id:assistantId,role:'assistant',content:'',status:'streaming',searchStatus:searchMode==='tavily'?'Searching free Tavily index…':null,webSearch:!!searchMode,createdAt:Date.now()};
    const nextThread={...active,title:active.messages.length===0?titleFrom(content,files):active.title,messages:[...active.messages,userMsg,assistantMsg]};
    setChats(old=>old.map(c=>c.id===chatId?nextThread:c));
    setDraft('');setAttachments([]);
    const controller=new AbortController();workRef.current={id:chatId,controller};setBusy(chatId);
    let output='',lastPaint=0;
    const paint=()=>patchChat(chatId,c=>({...c,updatedAt:Date.now(),messages:c.messages.map(m=>m.id===assistantId?{...m,content:output}:m)}));
    const token=t=>{output+=t;if(performance.now()-lastPaint>45){paint();lastPaint=performance.now();}};
    try {
      if(provider==='demo') await demoStream(content||files.map(f=>f.name).join(', '),controller.signal,token);
      else {
        let messages=apiMessages({...nextThread,messages:nextThread.messages.filter(m=>m.id!==assistantId)},settings.systemPrompt);
        if(searchMode==='tavily') {
          reserveFreeUse('tavily');setUsageRevision(v=>v+1);
          const sources=await tavilySearch(content,settings.search.tavilyKey,Number(settings.search.maxResults)||4,controller.signal);
          messages=includeSearchContext(messages,sources);
          patchChat(chatId,c=>({...c,messages:c.messages.map(m=>m.id===assistantId?{...m,sources,searchStatus:`Found ${sources.length} sources · generating answer…`}:m)}));
        }
        reserveFreeUse(provider);setUsageRevision(v=>v+1);
        await streamChat({provider,profile:config,temperature:settings.temperature,messages,signal:controller.signal,onToken:token,onSources:found=>{
          if(found.length) patchChat(chatId,c=>({...c,messages:c.messages.map(m=>{
            if(m.id!==assistantId)return m;
            const sources=normalizeSources([...(m.sources||[]),...found]);
            return {...m,sources};
          })}));
        }});
      }
      paint();
      patchChat(chatId,c=>({...c,messages:c.messages.map(m=>m.id===assistantId?{...m,content:output||'(The model returned no text.)',status:'done',searchStatus:null}:m)}));
    } catch(e) {
      const stopped=e.name==='AbortError';
      patchChat(chatId,c=>({...c,messages:c.messages.map(m=>m.id===assistantId?{...m,content:output,status:stopped?'stopped':'error',error:stopped?'':(e.message||String(e))}:m)}));
      if(!stopped&&e instanceof TypeError) setNotice('Network/CORS error. Check the provider URL, CORS policy and browser console.');
    } finally {workRef.current=null;setBusy(null);}
  }
  const sorted=useMemo(()=>[...chats].sort((a,b)=>(b.updatedAt||b.createdAt)-(a.updatedAt||a.createdAt)),[chats]);
  return <div className="app-height flex overflow-hidden text-slate-100">
    {drawer&&<div className="fixed inset-0 z-20 bg-black/65 md:hidden" onClick={()=>setDrawer(false)}/>}
    <aside className={`fixed md:relative inset-y-0 left-0 z-30 w-[min(84vw,310px)] md:w-[280px] shrink-0 flex flex-col border-r border-slate-800 bg-slate-900 safe-top safe-bottom transform transition-transform duration-200 ${drawer?'translate-x-0':'-translate-x-full md:translate-x-0'}`}>
      <div className="px-4 pt-5 pb-4 flex items-center justify-between">
        <div className="flex items-center gap-2.5"><div className="w-9 h-9 rounded-xl bg-gradient-to-br from-indigo-500 to-violet-700 grid place-items-center shadow-lg shadow-indigo-800/30"><Icon name="spark"/></div><div><div className="font-bold text-sm">LLM Workbench</div><div className="text-[10px] uppercase tracking-[.18em] text-slate-500">Chat client</div></div></div>
        <button className="md:hidden text-slate-400 p-2" onClick={()=>setDrawer(false)} aria-label="Close drawer"><Icon name="x"/></button>
      </div>
      <button onClick={addChat} className="btn btn-primary mx-4 mb-5"><Icon name="plus" size={16}/> New conversation</button>
      <div className="px-5 text-[10px] uppercase tracking-[.2em] font-semibold text-slate-500 mb-2">Conversations · {chats.length}</div>
      <div className="flex-1 overflow-y-auto thin-scroll px-2 space-y-1">{sorted.map(c=><div key={c.id} className={`group flex items-center rounded-xl border ${c.id===active?.id?'bg-indigo-500/10 border-indigo-500/30':'border-transparent hover:bg-slate-800/70'}`}>
        <button onClick={()=>changeChat(c.id)} className="text-left flex-1 min-w-0 px-3 py-3 flex items-center gap-2.5"><Icon name="message" size={16} className={c.id===active?.id?'text-indigo-400':'text-slate-500'}/><span className="truncate text-sm">{c.title}</span>{busy===c.id&&<span className="shrink-0 w-1.5 h-1.5 bg-indigo-400 rounded-full stream-dot"/>}</button>
        <button onClick={()=>deleteChat(c.id)} className="p-2 mr-1 text-slate-500 hover:text-rose-400" title="Delete conversation" aria-label={`Delete ${c.title}`}><Icon name="trash" size={15}/></button>
      </div>)}</div>
      <div className="m-3 p-3 rounded-xl bg-slate-950/60 border border-slate-800"><div className="flex items-center gap-2 text-xs text-slate-300"><span className="w-2 h-2 bg-emerald-400 rounded-full"/> Local browser storage</div><p className="text-[11px] text-slate-500 mt-1">No account or backend required.</p></div>
    </aside>
    <main className="flex-1 min-w-0 min-h-0 flex flex-col bg-slate-950">
      <header className="safe-top shrink-0 border-b border-slate-800/80 bg-slate-950/90 backdrop-blur">
        <div className="h-16 px-3 sm:px-5 flex items-center gap-2 sm:gap-4">
          <button className="md:hidden p-2 text-slate-300" onClick={()=>setDrawer(true)} aria-label="Open conversations"><Icon name="menu" size={22}/></button>
          <div className="flex-1 min-w-0"><h1 className="text-sm sm:text-base font-semibold truncate">{active?.title||'New conversation'}</h1><p className="text-[11px] text-emerald-300 truncate">FREE ONLY · {profile.model||'Choose a model'}</p></div>
          <button className="flex items-center gap-1.5 sm:gap-2 px-2 sm:px-3 py-1.5 rounded-full bg-slate-900 border border-slate-800 text-[10px] sm:text-xs text-slate-300 max-w-[105px] sm:max-w-none" onClick={()=>setSettingsOpen(true)}><span className={`w-1.5 h-1.5 rounded-full ${settings.provider==='demo'?'bg-amber-400':'bg-emerald-400'}`}/>{PROVIDERS[settings.provider].name}</button>
          <button className="btn btn-soft !p-2.5" title="Settings" aria-label="Settings" onClick={()=>setSettingsOpen(true)}><Icon name="settings" size={19}/></button>
        </div>
      </header>
      <div className="px-3 py-1.5 flex justify-between items-center gap-2 border-b border-emerald-800/50 bg-emerald-950/40 text-[10px] sm:text-xs">
        <span className="text-emerald-200 font-bold">FREE ONLY · No paid models or search</span>
        <button className="text-amber-200 underline shrink-0" onClick={()=>setSettingsOpen(true)}>Usage limits / billing warning</button>
      </div>
      <section className="flex-1 min-h-0 overflow-y-auto thin-scroll" aria-label="Chat messages">
        <div className="max-w-4xl mx-auto px-4 sm:px-8 py-6 md:py-8">
          {!active?.messages.length ? <div className="flex flex-col items-center justify-center text-center min-h-[48dvh]">
            <div className="w-16 h-16 rounded-3xl bg-gradient-to-br from-indigo-500/30 to-violet-600/10 border border-indigo-500/30 grid place-items-center text-indigo-300 mb-5"><Icon name="spark" size={30}/></div>
            <h2 className="text-2xl sm:text-3xl font-bold tracking-tight text-white">What shall we work on?</h2>
            <p className="text-slate-400 text-sm max-w-sm mt-3 leading-6">Chat with free and local AI models. Search the web, attach images, PDFs or code, and save generated snippets.</p>
            <div className="flex gap-2 flex-wrap justify-center mt-6">{['Write a Python script','Explain a PDF','Create a React component'].map(s=><button key={s} className="btn btn-soft border border-slate-700/70 !text-xs" onClick={()=>{setDraft(s);inputRef.current?.focus();}}>{s}</button>)}</div>
            <p className="text-xs text-slate-500 mt-6">Currently selected: <button className="text-indigo-300 underline" onClick={()=>setSettingsOpen(true)}>{PROVIDERS[settings.provider].name}</button></p>
          </div> : <div className="space-y-6">{active.messages.map(m=><Message key={m.id} message={m} streaming={busy===active.id&&m.role==='assistant'&&m.status==='streaming'}/>)}</div>}
          <div ref={bottomRef}/>
        </div>
      </section>
      <div className="glass shrink-0 border-t border-slate-800 safe-bottom px-3 pt-3 sm:px-6">
        <div className="max-w-4xl mx-auto">
          {notice&&<div className="flex gap-2 items-start justify-between bg-amber-500/10 text-amber-200 border border-amber-500/30 rounded-xl px-3 py-2 mb-2 text-xs"><span>{notice}</span><button onClick={()=>setNotice('')} aria-label="Dismiss"><Icon name="x" size={14}/></button></div>}
          {attachments.length>0&&<div className="flex gap-2 overflow-x-auto thin-scroll pb-2">{attachments.map(a=><div key={a.id} className="flex shrink-0 items-center gap-2 max-w-52 border border-slate-700 rounded-lg p-1.5 bg-slate-900">{a.type==='image'?<img src={a.dataUrl} className="h-9 w-9 object-cover rounded" alt={a.name}/>:<Icon name="file" size={19} className="text-indigo-400"/>}<span className="text-[11px] truncate max-w-28" title={a.name}>{a.name}</span><button className="text-slate-400 hover:text-white" aria-label={`Remove ${a.name}`} onClick={()=>setAttachments(xs=>xs.filter(x=>x.id!==a.id))}><Icon name="x" size={14}/></button></div>)}</div>}
          <div className="flex items-center justify-between pb-2 gap-2"><button className="search-toggle" type="button" aria-pressed={webEnabled} aria-label={webEnabled?'Disable web search':'Enable web search'} onClick={()=>setSettings(s=>({...s,search:{...s.search,enabled:!s.search.enabled}}))}><Icon name="globe" size={15}/> Web {webEnabled?'on':'off'} · Tavily Free</button>
            <div className="text-[10px] text-emerald-300 text-right">{settings.provider==='demo'||settings.provider==='ollama'?'Local · no API bill':`Local cap: ${counted(settings.provider).day}/${LOCAL_CAPS[settings.provider]?.day||'∞'} today`}{webEnabled&&` · search ${counted('tavily').month}/900`}</div></div>
          <div className="flex items-end gap-2 rounded-2xl bg-slate-900 border border-slate-700 focus-within:border-indigo-500/80 p-2 shadow-xl shadow-black/20">
            <input type="file" ref={fileRef} className="hidden" multiple accept="image/png,image/jpeg,image/webp,image/gif,.pdf,.txt,.md,.json,.jsonl,.js,.jsx,.ts,.tsx,.py,.cs,.html,.css,.xml,.csv,.yaml,.yml,.java,.go,.rs,.sql,.sh,.ps1,.cpp,.c,.log,.toml,.ini,.conf,.kt,.dart" onChange={e=>attachFiles([...e.target.files])}/>
            <button className="shrink-0 h-10 w-10 grid place-items-center rounded-xl text-slate-400 hover:bg-slate-800 hover:text-indigo-300 disabled:opacity-40" disabled={reading} title="Attach images, PDF, text or code" aria-label="Add attachment" onClick={()=>fileRef.current?.click()}><Icon name="paperclip" size={20}/></button>
            <textarea ref={inputRef} rows="1" className="composer-text thin-scroll w-full min-w-0 bg-transparent px-1.5 py-2.5 text-sm leading-6 outline-none placeholder:text-slate-500" value={draft} onChange={e=>{setDraft(e.target.value);e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,170)+'px';}} placeholder={reading?'Reading attachment…':'Ask anything…'} onKeyDown={e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.nativeEvent.isComposing){e.preventDefault();send();}}}/>
            {busy?<button className="btn btn-soft !p-2.5 shrink-0 !bg-rose-500/20 !text-rose-300" title="Stop generation" aria-label="Stop generation" onClick={stop}><Icon name="stop" size={20}/></button>:<button className="btn btn-primary !p-2.5 shrink-0" title="Send" aria-label="Send message" disabled={reading||(!draft.trim()&&!attachments.length)} onClick={send}><Icon name="send" size={20}/></button>}
          </div>
          <p className="text-center text-[10px] text-slate-500 mt-2">{reading?'Extracting file contents…':busy?'Searching/generating · Stop to cancel':webEnabled?'Free Tavily search only · Browser usage caps active':'Free-only · Browser counters are NOT provider billing guarantees · Enter to send'}</p>
        </div>
      </div>
    </main>
    {settingsOpen&&<Settings value={settings} onChange={setSettings} onClose={()=>setSettingsOpen(false)}/>}
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
