  <style>
    /* First-paint splash: no React, external fonts, images or network access. */
    body.splash-active { overflow: hidden; }

    #launch-splash {
      position: fixed; inset: 0; z-index: 99999; display: flex;
      align-items: center; justify-content: center; box-sizing: border-box;
      min-height: 100svh; min-height: 100dvh;
      padding: max(24px, env(safe-area-inset-top, 0px)) 22px max(28px, env(safe-area-inset-bottom, 0px));
      color: #d3fce1; text-align: center; overflow: hidden; isolation: isolate;
      background: radial-gradient(ellipse at 50% 37%, #123b2a 0%, #06140e 42%, #010703 86%);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      opacity: 1; transition: opacity 460ms ease, visibility 460ms ease;
    }
    #launch-splash::before {
      content: ""; position: absolute; inset: 0; pointer-events: none; z-index: -1;
      background-image: linear-gradient(#45ff9610 1px, transparent 1px),
                        linear-gradient(90deg, #45ff9610 1px, transparent 1px);
      background-size: 30px 30px; opacity: .45;
      mask-image: radial-gradient(ellipse at 50% 40%, #000, transparent 75%);
    }
    #launch-splash::after {
      content: "01001100 10010110 11000101 00110010 00101011 10100111 10101100";
      position: absolute; inset: 0; z-index: -1; overflow: hidden;
      transform: skewY(-12deg) translateY(-10%); pointer-events: none;
      font-size: clamp(14px, 3vw, 24px); font-weight: 700; line-height: 4.1;
      letter-spacing: .8em; overflow-wrap: anywhere; opacity: .075; color: #73ff97;
      animation: cheap-rain 8s linear infinite alternate;
    }
    #launch-splash.is-leaving { opacity: 0; visibility: hidden; pointer-events: none; }
    .splash-panel { width: min(100%, 390px); display: flex; flex-direction: column; align-items: center; }
    .splash-art {
      width: min(77vw, 318px); max-height: 42dvh; display: block; overflow: visible;

    }
    .splash-brand { margin: 12px 0 0; color: #b2ffcc; font-weight: 900;

      text-shadow: 0 0 24px #44ff9960; }

      background: #092317; box-shadow: 0 0 16px #0deb5c15; }
    .splash-progress::before { content: ""; position: absolute; inset: 0;
      width: 38%; background: linear-gradient(90deg, transparent, #6dff9b 45%, #c4ffd1 70%, transparent);

    .splash-message { margin-top: 14px; font-size: 12px; letter-spacing: .065em; color: #8ddbaa; }

    @media (prefers-reduced-motion: reduce) {
      .splash-art, #launch-splash::after, .splash-progress::before {animation: none;}

    :root { color-scheme: dark; }
    * { -webkit-tap-highlight-color: transparent; }

    .md { color: #e2e8f0; font-size: 14px; line-height: 1.75; overflow-wrap: anywhere; }

    .md > :last-child { margin-bottom: 0; }

    .md table { border-collapse: collapse; display: block; max-width: 100%; overflow-x: auto; margin: 12px 0; }
    .md th, .md td { border: 1px solid #334155; padding: 6px 10px; white-space: nowrap; }
    .md th { background: #1e293b; }
    /* Compact factual two-column tables must show BOTH columns on a phone,
       rather than forcing users to discover horizontal scroll. Wider tables
       retain their existing sideways scrolling behaviour. */
    @media (max-width: 680px) {
      .md table:has(tr > :nth-child(2):last-child):not(:has(tr > :nth-child(3))) {
        display: table; width: 100%; table-layout: fixed; overflow: visible;
      }
      .md table:has(tr > :nth-child(2):last-child):not(:has(tr > :nth-child(3))) th,
      .md table:has(tr > :nth-child(2):last-child):not(:has(tr > :nth-child(3))) td {
        white-space: normal; overflow-wrap: anywhere; word-break: normal; padding: 7px;
      }
      .md table:has(tr > :nth-child(2):last-child):not(:has(tr > :nth-child(3))) tr > :first-child {
        width: 37%;
      }
    }
    .md hr { border-color: #334155; margin: 12px 0; }
    .code-shell { border: 1px solid #334155; background: #0b1222; border-radius: 12px; overflow: hidden; margin: 12px 0; }
    .code-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 38px; padding: 0 8px 0 12px; border-bottom: 1px solid #283449; color: #94a3b8; font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; }

    .sources { margin-top:8px; }

async function prepareHordeImageAsset(rawImage,requestId){

    await writeHordeImage(requestId,blob);

  }catch(error){
    diagLog('normal','horde-image-storage-unavailable',
      {reason:String(error.message||error).slice(0,180)});

function hordeImageUrl(value){

    return url.href;

}
// Live model selection is advisory. The Horde itself always owns worker choice.
// Cache network discovery for ten minutes, model reference for an hour.
const HORDE_MODEL_REFERENCE_API='https://models.aihorde.net/api/model_references/v2/image_generation/model/';
const HORDE_MODEL_CACHE_MS=10*60*1000;
const HORDE_MODEL_REFERENCE_MS=60*60*1000;
let hordeModelCache={at:0,models:[],promise:null};
const hordeReferenceCache=new Map();
function hordeNormaliseModels(data){
  if(!Array.isArray(data))throw new Error('AI Horde did not return a model list.');
  const byName=new Map();
  for(const row of data){
    if(!row||typeof row.name!=='string'||!row.name.trim()||row.name.length>140)continue;
    if(row.type&&!['image','stable','image_generation'].includes(row.type))continue;
    const count=Math.max(0,Math.min(10000,Number(row.count)||0));
    if(count<1)continue;
    const model={name:row.name.trim(),count,
      queued:Math.max(0,Number(row.queued)||0),
      eta:Math.max(0,Number(row.eta)||0),
      performance:Math.max(0,Number(row.performance)||0),
      nsfw:row.nsfw===true};
    if(model.nsfw)continue;
    const previous=byName.get(model.name);
    if(!previous||model.count>previous.count)byName.set(model.name,model);
  }
  return [...byName.values()].sort((a,b)=>b.count-a.count||a.queued-b.queued||a.name.localeCompare(b.name));
}
async function fetchHordeModels({force=false,signal}={}){
  if(!force&&hordeModelCache.models.length&&Date.now()-hordeModelCache.at<HORDE_MODEL_CACHE_MS)
    return hordeModelCache.models;
  if(hordeModelCache.promise)return hordeModelCache.promise;
  const promise=(async()=>{
    const controller=new AbortController();
    const abort=()=>controller.abort();
    if(signal?.aborted)throw new DOMException('Stopped','AbortError');
    signal?.addEventListener('abort',abort,{once:true});
    const timer=setTimeout(abort,8000);
    try{
      const data=await hordeJson(HORDE_IMAGE_API+'/status/models?type=image',{
        headers:{'Client-Agent':HORDE_CLIENT_AGENT},signal:controller.signal});
      const models=hordeNormaliseModels(data);
      if(!models.length)throw new Error('There are no currently available compatible image workers.');
      hordeModelCache={at:Date.now(),models,promise:null};
      return models;
    }finally{
      clearTimeout(timer);
      signal?.removeEventListener('abort',abort);
    }
  })();
  hordeModelCache.promise=promise;
  try{return await promise;}
  finally{if(hordeModelCache.promise===promise)hordeModelCache.promise=null;}
}
async function fetchHordeModelReference(name,signal){
  const entry=hordeReferenceCache.get(name);
  if(entry&&Date.now()-entry.at<HORDE_MODEL_REFERENCE_MS)return entry.record;
  let record=null;
  const controller=new AbortController();
  const abort=()=>controller.abort();
  if(signal?.aborted)throw new DOMException('Stopped','AbortError');
  signal?.addEventListener('abort',abort,{once:true});
  const timer=setTimeout(abort,5000);
  try{
    const response=await fetch(HORDE_MODEL_REFERENCE_API+encodeURIComponent(name),{
      cache:'default',mode:'cors',signal:controller.signal,headers:{Accept:'application/json'}});
    if(response.ok){
      const raw=await response.json();
      if(raw&&typeof raw==='object'&&!Array.isArray(raw))record=raw;
    }
  }catch(error){
    if(signal?.aborted)throw error;
    diagLog('normal','horde-model-reference-unavailable',{
      model:name,reason:String(error.message||error).slice(0,130)});
  }finally{
    clearTimeout(timer);
    signal?.removeEventListener('abort',abort);
  }
  hordeReferenceCache.set(name,{record,at:Date.now()});
  if(hordeReferenceCache.size>80)hordeReferenceCache.delete(hordeReferenceCache.keys().next().value);

}
function hordeStyleFromPrompt(prompt){
  const t=String(prompt||'').toLowerCase();
  if(/\b(anime|manga|cel.shaded|chibi)\b/.test(t))return 'anime';
  if(/\b(pixel art|8.bit|16.bit|sprite|retro game)\b/.test(t))return 'pixel_art';
  if(/\b(photo|photograph|photoreal|realistic portrait|dslr|camera lens)\b/.test(t))return 'photographic';
  if(/\b(fantasy|dragon|wizard|magical)\b/.test(t))return 'fantasy';
  if(/\b(cartoon|illustration|comic|watercolour|watercolor|storybook)\b/.test(t))return 'illustration';
  return 'digital_art';
}
function hordeModelFamily(name,baseline=''){
  const x=(String(name)+' '+String(baseline)).toLowerCase();
  if(/(flux|schnell|dev fp8)/.test(x))return 'flux';
  if(/(turbo|lightning|lcm|hyper.sd)/.test(x))return 'fast';
  if(/(sdxl|stable.diffusion.xl|xl\b|pony|illustrious|noobai)/.test(x))return 'sdxl';
  if(/(sd.?1[. -]?5|stable.diffusion.1)/.test(x))return 'sd15';
  return 'unknown';
}
function scoreHordeModel(model,{style,quality,model_hint}={}){
  const name=model.name.toLowerCase(),hint=String(model_hint||'').toLowerCase().trim();
  const family=hordeModelFamily(name);
  let score=Math.log2(1+model.count)*4
    -Math.min(25,model.queued/Math.max(1,model.count))*0.7
    -Math.min(22,model.eta/110);
  if(family==='sdxl')score+=17;
  if(family==='flux')score+=18;
  if(family==='sd15')score+=2;
  if(family==='fast')score+=(quality==='fast'?17:-8);
  if(quality==='quality'&&family==='sdxl')score+=5;
  if(quality==='quality'&&family==='fast')score-=10;
  if(style==='photographic'){
    if(/(realistic|realism|photo|juggernaut|dreamshaper|flux)/.test(name))score+=17;
    if(/anime|pony|cartoon/.test(name))score-=12;
  }else if(style==='anime'){
    if(/anime|manga|pony|illustrious|noobai/.test(name))score+=19;
    if(/realistic|photograph/.test(name))score-=12;
  }else if(style==='pixel_art'){
    if(/pixel|sprite|retro/.test(name))score+=25;
  }else if(style==='fantasy'){
    if(/fantasy|dream|epic|juggernaut/.test(name))score+=11;
  }else if(style==='illustration'||style==='digital_art'){
    if(/illustrat|art|dreamshaper|fantasy/.test(name))score+=9;
  }
  if(hint&&name===hint)score+=100;
  else if(hint&&hint.length>=3&&name.includes(hint))score+=25;
  if(quality==='fast')score+=Math.max(0,12-Math.min(12,model.eta/20));
  return score;
}
function hordeDimensions(size,aspect){
  const base=[512,768].includes(Number(size))?Number(size):512;
  if(aspect==='portrait')return base===512?{width:384,height:640}:{width:640,height:896};
  if(aspect==='landscape')return base===512?{width:640,height:384}:{width:896,height:640};
  return {width:base,height:base};
}
function hordeSamplingForModel(name,reference,preferences={}){
  const requirements=reference?.requirements&&typeof reference.requirements==='object'
    ?reference.requirements:{};
  const family=hordeModelFamily(name,reference?.baseline);
  const quality=preferences.quality||'balanced';
  const fast=quality==='fast',best=quality==='quality';
  let steps=family==='flux'?4:family==='fast'?6:family==='sdxl'?(fast?18:best?32:26):fast?16:best?30:23;
  let cfgScale=family==='flux'||family==='fast'?1:family==='sdxl'?6:7;
  const range=requirements.range_steps;
  const goodRange=Array.isArray(range)&&range.length===2&&range.every(n=>Number.isFinite(n)&&n>=1);
  if(goodRange){
    const low=Math.min(range[0],range[1]),high=Math.max(range[0],range[1]);
    steps=fast?low:best?high:Math.round((low+high)/2);
  }
  if(typeof requirements.cfg_scale==='number'&&Number.isFinite(requirements.cfg_scale))
    cfgScale=requirements.cfg_scale;
  if(Number.isInteger(preferences.steps)){
    const maxFamilySteps=family==='flux'||family==='fast'?10:40;
    steps=goodRange?Math.max(Math.min(range[0],range[1]),Math.min(Math.max(...range),preferences.steps))
      :Math.min(maxFamilySteps,preferences.steps);
  }
  if(Number.isFinite(preferences.cfg_scale)&&preferences.cfg_scale>=0){
    const suggested=typeof requirements.cfg_scale==='number'&&Number.isFinite(requirements.cfg_scale)
      ?requirements.cfg_scale:cfgScale;

    // overpower that by requesting a generic diffusion CFG such as 7.5.
    if(family==='flux'||family==='fast')cfgScale=suggested;
    else cfgScale=Math.max(suggested-2,Math.min(suggested+2,preferences.cfg_scale));
  }
  steps=Math.max(1,Math.min(family==='flux'||family==='fast'?10:40,Math.round(steps)));
  cfgScale=Math.max(0,Math.min(15,Number(cfgScale.toFixed(2))));
  const allowedSamplers=Array.isArray(requirements.samplers)
    ?requirements.samplers.filter(v=>typeof v==='string'&&/^k_[a-z0-9_]{2,40}$/.test(v)):[];

  const sampler=allowedSamplers.includes(desired)?desired:allowedSamplers[0]||null;
  const schedulers=Array.isArray(requirements.schedulers)?requirements.schedulers:[];
  const karras=schedulers.includes('karras')?true:schedulers.includes('normal')?false:null;
  const clipSkip=Number.isInteger(requirements.clip_skip)&&requirements.clip_skip>=1&&requirements.clip_skip<=3?
    requirements.clip_skip:null;

    recommendation:reference?'model reference':'model-family defaults'};
}
async function resolveHordeGeneration(prompt,settings={},preferences={},signal,onPhase=()=>{}){
  const size=[512,768].includes(Number(settings.size))?Number(settings.size):512;
  const requested={...preferences,
    quality:['fast','quality'].includes(settings.quality)?settings.quality:
      ['fast','balanced','quality'].includes(preferences.quality)?preferences.quality:
        ['fast','balanced','quality'].includes(settings.quality)?settings.quality:'balanced'};
  const style=['photographic','illustration','anime','pixel_art','fantasy','digital_art'].includes(requested.style)
    ?requested.style:hordeStyleFromPrompt(prompt);
  const aspect=['square','portrait','landscape'].includes(requested.aspect_ratio)
    ?requested.aspect_ratio
    :/\b(9:16|portrait orientation|vertical format|vertical image|tall portrait)\b/i.test(prompt)?'portrait'
    :/\b(16:9|landscape orientation|horizontal format|wide image|widescreen)\b/i.test(prompt)?'landscape'
    :'square';
  const dims=hordeDimensions(size,aspect);
  const basic=()=>({prompt,params:{...hordeDimensions(size,'square'),steps:20,n:1},
    nsfw:false,censor_nsfw:true,r2:false,shared:false});
  if(settings.mode==='basic')
    return {payload:basic(),details:{mode:'basic',style,quality:'basic',source:'original defaults',
      width:size,height:size,steps:20,model:null}};
  let available;
  try{
    onPhase('Finding available AI Horde image models…');
    available=await fetchHordeModels({signal});
  }catch(error){
    if(signal?.aborted)throw error;
    diagLog('normal','horde-model-discovery-fallback',{reason:String(error.message||error).slice(0,160)});
    onPhase('Model discovery unavailable · using original settings');
    return {payload:basic(),details:{mode:'basic',source:'discovery unavailable',fallback:true,
      width:size,height:size,steps:20,model:null}};
  }
  const pinned=String(settings.model||'auto');
  const exactPinned=available.find(x=>x.name===pinned);
  let chosen=exactPinned||[...available].sort((a,b)=>
    scoreHordeModel(b,{...requested,style})-scoreHordeModel(a,{...requested,style}))[0];
  if(!chosen)throw new Error('No compatible AI Horde image models available.');
  onPhase('Selected '+chosen.name+' · checking model recommendations…');
  let reference=await fetchHordeModelReference(chosen.name,signal);
  // Limit retries when a model is marked NSFW; never recursively alternate
  // between two unsafe models or submit a known NSFW checkpoint.
  if(reference?.nsfw===true){
    const alternatives=available.filter(m=>m.name!==chosen.name&&m.nsfw!==true)
      .sort((a,b)=>scoreHordeModel(b,{...requested,style})-scoreHordeModel(a,{...requested,style}));
    let replacement=null;
    for(const candidate of alternatives.slice(0,3)){
      const record=await fetchHordeModelReference(candidate.name,signal);
      if(record?.nsfw!==true){replacement={candidate,record};break;}
    }
    if(!replacement)return {payload:basic(),details:{mode:'basic',source:'model safety fallback',fallback:true,
      width:size,height:size,steps:20,model:null}};
    chosen=replacement.candidate;reference=replacement.record;
  }
  const sampled=hordeSamplingForModel(chosen.name,reference,requested);
  const params={width:dims.width,height:dims.height,steps:sampled.steps,
    cfg_scale:sampled.cfgScale,n:1};
  if(sampled.sampler)params.sampler_name=sampled.sampler;
  if(sampled.karras!==null)params.karras=sampled.karras;
  if(sampled.clipSkip!==null)params.clip_skip=sampled.clipSkip;
  if(typeof preferences.seed==='string'&&/^\d{1,15}$/.test(preferences.seed))
    params.seed=preferences.seed;
  const negative=typeof preferences.negative_prompt==='string'
    ?preferences.negative_prompt.replace(/###/g,' ').trim().slice(0,600):'';
  const body={prompt:prompt.trim().replace(/###/g,' ')+(negative?'###'+negative:''),
    models:[chosen.name],params,nsfw:false,censor_nsfw:true,r2:false,shared:false};
  return {payload:body,details:{mode:'smart',model:chosen.name,style,quality:requested.quality,
    source:sampled.recommendation,workers:chosen.count,queued:chosen.queued,
    width:params.width,height:params.height,steps:sampled.steps,cfgScale:sampled.cfgScale,
    sampler:sampled.sampler,karras:sampled.karras,clipSkip:sampled.clipSkip,
    negativePrompt:negative,seed:params.seed||null}};
}
function hordeGenerationPayload(prompt,size){

    throw new Error('Enter an image prompt between 1 and 3,000 characters.');
  if(![512,768].includes(size))throw new Error('Unsupported image size.');
  return {prompt:prompt.trim(),params:{width:size,height:size,steps:20,n:1},
    nsfw:false,censor_nsfw:true,r2:false,shared:false};
}
async function hordeJson(url,options={}){
  const res=await fetch(url,{cache:'no-store',mode:'cors',...options});
  let data;
  try{data=await res.json();}catch{throw new Error('AI Horde returned a non-JSON response (HTTP '+res.status+').');}
  if(!res.ok||data?.error){
    const text=String(data?.message||data?.error||'Request rejected').slice(0,260);
    throw new Error('AI Horde HTTP '+res.status+': '+text);
  }
  return data;
}
async function requestHordeImage({prompt,size=512,key='',signal,settings={},preferences={},
  onAccepted=()=>{},onProgress=()=>{},onPhase=()=>{},onResolved=()=>{}}){
  const headers={'apikey':(key.trim()||HORDE_ANON_KEY),
    'Client-Agent':HORDE_CLIENT_AGENT,'Content-Type':'application/json'};
  if(signal?.aborted)throw new DOMException('Stopped','AbortError');
  const {payload,details}=await resolveHordeGeneration(prompt,{...settings,size},preferences,signal,onPhase);
  if(signal?.aborted)throw new DOMException('Stopped','AbortError');
  onResolved(details);
  diagLog('normal','horde-image-plan',{...details,negativePrompt:details.negativePrompt?'[supplied]':''});
  const queued=await hordeJson(HORDE_IMAGE_API+'/generate/async',{
    method:'POST',headers,signal,body:JSON.stringify(payload)});
  if(typeof queued.id!=='string'||!queued.id.trim())throw new Error('AI Horde accepted the request without a job ID.');
  const id=queued.id;
  onAccepted(id);
  onPhase('Queued on AI Horde');
  const began=performance.now();
  while(true){
    if(signal?.aborted)throw new DOMException('Stopped','AbortError');
    if(performance.now()-began>HORDE_MAX_WAIT_MS)throw new Error('AI Horde queue timed out after ten minutes. Try again when workers are available.');
    // Horde recommends checking with /check rather than repeatedly fetching images.
    await wait(3000,signal);
    const state=await hordeJson(HORDE_IMAGE_API+'/generate/check/'+encodeURIComponent(id),{
      method:'GET',headers:{'Client-Agent':HORDE_CLIENT_AGENT},signal});
    if(state.faulted)throw new Error('AI Horde reported a failed image job.');
    const queue=Number(state.queue_position),estimate=Number(state.wait_time);
    onProgress({queue:Number.isFinite(queue)&&queue>=0?queue:null,
      seconds:Number.isFinite(estimate)&&estimate>=0?estimate:null,
      working:Number(state.processing||0)>0,
      finished:Number(state.finished||0)>0});
    if(!state.done)continue;
    const result=await hordeJson(HORDE_IMAGE_API+'/generate/status/'+encodeURIComponent(id),{
      method:'GET',headers:{'Client-Agent':HORDE_CLIENT_AGENT},signal});
    const images=Array.isArray(result.generations)?result.generations:[];
    if(!images.length)throw new Error('AI Horde finished but returned no image.');
    const item=images[0];
    if(item.censored)throw new Error('AI Horde censored the generated image.');
    const asset=await prepareHordeImageAsset(item.img,id);
    return {...asset,model:String(item.model||details.model||'AI Horde worker').slice(0,140),
      seed:String(item.seed??'').slice(0,60),requestId:id,size,
      width:details.width||size,height:details.height||size,
      generation:{...details,seed:String(item.seed??details.seed??'').slice(0,60)},
      createdAt:Date.now()};
  }
}
// Browser-owned image job. The model receives acknowledgement immediately.
async function completeHordeAssistantJob({prompt,size,key,settings={},preferences={},signal,trace,patch}){
  let requestId=null,finished=false;
  try{
    const result=await requestHordeImage({prompt,size,key,settings,preferences,signal,
      onResolved:details=>patch({imageGeneration:details}),
      onAccepted:id=>{requestId=id;diagLog('normal','horde-tool-queued',{requestId:id},trace);},
      onPhase:phase=>patch({imageStatus:phase}),
      onProgress:state=>patch({imageStatus:state.working?'Generating image':'Waiting in AI Horde queue',
        imageProgress:state})
    });
    if(signal.aborted)throw new DOMException('Stopped','AbortError');
    finished=true;
    patch({imageResult:result,imageGeneration:result.generation,
      imagePending:false,imageProgress:null,imageStatus:null,
      imageConsentRequest:null,imageError:null});

    return result;
  }catch(error){
    const stopped=error.name==='AbortError'||signal.aborted;
    patch({imagePending:false,imageProgress:null,imageStatus:null,
      imageError:stopped?'Image generation stopped.':String(error.message||error)});
    diagLog('normal',stopped?'horde-tool-cancelled':'horde-tool-error',
      {requestId,message:stopped?'User cancelled':String(error.message||error)},trace);

async function cancelHordeImage(id,key=''){

  try{
    await fetch(HORDE_IMAGE_API+'/generate/status/'+encodeURIComponent(id),{
      method:'DELETE',mode:'cors',cache:'no-store',
      headers:{'apikey':key.trim()||HORDE_ANON_KEY,'Client-Agent':HORDE_CLIENT_AGENT}
    });

}
async function saveHordeImage(image){

    blob=await readHordeImage(image.storageId);
    if(!blob)throw new Error('The saved image is no longer in this browser.');
  }else if(typeof image?.url==='string'&&image.url.startsWith('data:image/')){
    blob=await (await fetch(image.url)).blob();
  }else{
    // Older R2 image URLs are valid for navigation but cannot be read via CORS.
    // The UI opens those directly and asks the user to save from Chrome.
    throw new Error('Remote image: use Open original and save it in your browser.');
  }
  if(!blob.type.startsWith('image/'))throw new Error('The returned data was not an image.');
  const ext=blob.type.includes('png')?'png':blob.type.includes('jpeg')?'jpg':'webp';
  const href=URL.createObjectURL(blob);
  try{
    const a=document.createElement('a');a.href=href;
    a.download='tight-arse-ai-'+String(image.requestId||'image').slice(0,40)+'.'+ext;
    document.body.appendChild(a);a.click();a.remove();
  }finally{setTimeout(()=>URL.revokeObjectURL(href),15000);}
}

async function streamChatWithRateWait(options,onReserved=()=>{}){
  const {provider,signal,trace={}}=options;
  if(provider==='browser')return streamBrowserChat(options);
  let providerRetries=0,localWaits=0,oversizedRetries=0;
  let requestOptions=options;

    if(signal?.aborted)throw new DOMException('Stopped','AbortError');

      // minute quota. A daily cap, or failure to save the counter, remains final.

        throw error;

      if(delay<=0||delay>65000)throw error;

      await wait(delay,signal);

        // Trim it once more, preserving user turn and tool-call/result pairing.

function Quota({provider,revision=0}) {
  const caps=LOCAL_CAPS[provider];
  if(!caps)return null;
  const counts=counted(provider);
  return <div className="grid gap-2">{Object.entries(caps).map(([period,limit])=>{
    const used=counts[period],ratio=Math.min(1,used/limit);
    return <div key={period}><div className="flex justify-between text-[11px] mb-1"><span className="text-slate-300">App {period==='minute'?'last 60 seconds':period==='day'?'today (UTC)':'this month (UTC)'}</span><strong className={ratio>=1?'text-rose-300':ratio>=0.8?'text-amber-300':'text-emerald-300'}>{used} / {limit} · {Math.max(0,limit-used)} left</strong></div><div className="quota-progress"><span style={{width:(ratio*100)+'%'}} className={ratio>=1?'full':ratio>=0.8?'near':''}/></div></div>;
  })}</div>;
}

// Native Google models.list returns `models/<id>`, pagination and
// supportedGenerationMethods. Use it for discovery only; ordinary chats still
// use Google's OpenAI-compatible /chat/completions endpoint.
async function listGeminiNativeModels(profile,trace){
  const endpoint='https://generativelanguage.googleapis.com/v1beta/models';
  const headers={'x-goog-api-key':profile.key.trim()};
  let pageToken='',pages=0,all=[];
  const seenTokens=new Set();
  do{
    if(pages>=10)throw new Error('Google model list has more than 10 pages; refusing an incomplete discovery.');
    const url=new URL(endpoint);
    url.searchParams.set('pageSize','100');
    if(pageToken)url.searchParams.set('pageToken',pageToken);
    const began=performance.now();
    const res=await fetch(url.toString(),{headers});
    diagLog('normal','model-discovery-http',{
      provider:'gemini',endpoint:'native /v1beta/models',
      page:pages+1,status:res.status,elapsedMs:Math.round(performance.now()-began)
    },trace);
    if(!res.ok){
      let message='HTTP '+res.status;
      try{const data=await res.json();if(data.error?.message)message+=': '+String(data.error.message).slice(0,220);}catch{}
      throw new Error(message);
    }
    const data=await res.json();
    if(!Array.isArray(data.models))
      throw new Error('Google native model list returned an unexpected response (missing models array).');
    all.push(...data.models);
    pages++;
    pageToken=typeof data.nextPageToken==='string'?data.nextPageToken:'';
    if(pageToken){
      if(seenTokens.has(pageToken))throw new Error('Google model list returned a repeated page token.');
      seenTokens.add(pageToken);
    }
  }while(pageToken);
  diagLog('normal','gemini-models-listed',{pages,total:all.length,
    chatCapable:all.filter(x=>x.supportedGenerationMethods?.includes('generateContent')).length
  },trace);
  return all;
}

function ProviderSetupWizard({value,onChange,onClose,onUsage}) {
  const [step,setStep]=useState(0);
  const [guideIndex,setGuideIndex]=useState(0);
  const [guideHelp,setGuideHelp]=useState(false);
  const [guideCompleted,setGuideCompleted]=useState({});
  const [draft,setDraft]=useState(()=>{
    const id=value.provider;
    const p=value.profiles[id]||freshProfiles()[id];
    return {provider:id,key:p.key||'',url:p.url||PROVIDERS[id].url,
      model:isApprovedModel(id,p.model)?p.model:PROVIDERS[id].model,
      confirmed:!!value.freeTierConfirmed?.[id]};
  });
  const [showKey,setShowKey]=useState(false);
  const [test,setTest]=useState({status:'idle',message:''});
  const [saved,setSaved]=useState(false);
  const [testedOnSave,setTestedOnSave]=useState(false);
  const [testing,setTesting]=useState(false);
  const testAbortRef=useRef(null);
  const [localProgress,setLocalProgress]=useState(browserModelStatus);
  useEffect(()=>subscribeBrowserModelStatus(setLocalProgress),[]);
  const info=PROVIDERS[draft.provider],guide=WIZARD_GUIDES[draft.provider];
  const hosted=!['ollama','demo','browser'].includes(draft.provider);
  const tour=WIZARD_TOURS[draft.provider],action=tour[Math.min(guideIndex,tour.length-1)];
  const labels=['Choose','Account','Key / connection','Model','Test'];
  const stored=(value.discoveredModels?.[draft.provider]||[]).filter(id=>isApprovedModel(draft.provider,id));
  const suggested=info.models.filter(([id])=>isApprovedModel(draft.provider,id));
  const menu=stored.length?stored.map(id=>[id,id+' · discovered']):suggested;
  const models=menu.some(([id])=>id===draft.model)?menu:[...menu,[draft.model,draft.model+' · selected']];
  const sentences=[
    'Fine. I will help you get AI working without selling a kidney.',
    action.robot,
    hosted?'Paste the key here. I will not send it to any service except the provider you choose.':
      draft.provider==='ollama'?'Point me at your private Ollama server. No cloud required.':'No key. No credit card. No excuses.',
    'Pick a free model. The expensive ones are not invited.',
    draft.provider==='browser'?'We will load a real model on your device. No remote inference!':'Ready for a tiny test request? It uses your free quota, not a magic unlimited allowance.',
    'There. Connected. Do not expect me to smile.'
  ];
  function choose(id){
    const p=value.profiles[id]||freshProfiles()[id];
    setDraft({provider:id,key:p.key||'',url:p.url||PROVIDERS[id].url,
      model:isApprovedModel(id,p.model)?p.model:PROVIDERS[id].model,
      confirmed:!!value.freeTierConfirmed?.[id]});
    setTest({status:'idle',message:''});setShowKey(false);
    setGuideIndex(0);setGuideHelp(false);setGuideCompleted({});
  }
  function change(changes){setDraft(d=>({...d,...changes}));setTest({status:'idle',message:''});}
  const allowed=step!==2||(hosted?!!draft.key.trim()&&draft.confirmed:true);
  function saveConfiguration(){
    // No changes are committed until Finish / Save without testing.
    enforceFreeOnly(draft.provider,{...value.profiles[draft.provider],...draft},
      {...value,freeTierConfirmed:{...value.freeTierConfirmed,[draft.provider]:draft.confirmed}});
    onChange(current=>({...current,provider:draft.provider,
      freeTierConfirmed:{...current.freeTierConfirmed,[draft.provider]:hosted?draft.confirmed:false},
      profiles:{...current.profiles,[draft.provider]:{...current.profiles[draft.provider],
        key:hosted?draft.key.trim():'',
        url:draft.provider==='ollama'?draft.url.trim():PROVIDERS[draft.provider].url,
        model:draft.model}}}));
    setTestedOnSave(test.status==='ok');setSaved(true);setStep(5);
  }
  async function runTest(){
    if(testing)return;
    setTesting(true);setTest({status:'running',message:'Connecting directly to '+info.name+'…'});
    const controller=new AbortController();
    testAbortRef.current=controller;
    const timeout=draft.provider==='browser'?null:setTimeout(()=>controller.abort(),30000);
    try{
      const p={...value.profiles[draft.provider],...draft};
      enforceFreeOnly(draft.provider,p,{...value,
        freeTierConfirmed:{...value.freeTierConfirmed,[draft.provider]:draft.confirmed}});
      if(draft.provider==='demo'){
        setTest({status:'ok',message:'The local demonstration mode is ready. No remote request was sent.'});
        return;
      }
      if(draft.provider==='browser'){
        const result=await streamBrowserChat({profile:p,temperature:0.3,
          messages:[{role:'user',content:'Answer with the single word READY.'}],
          signal:controller.signal,onToken:()=>{},trace:{wizard:true}});
        setTest({status:'ok',message:'Local model replied: '+result.content.slice(0,220)});
        return;
      }
      // Every hosted test is a real inference request; count it before sending.
      if(LOCAL_CAPS[draft.provider]){reserveFreeUse(draft.provider);onUsage?.();}
      const body={model:draft.model,messages:[{role:'user',content:'Reply with exactly READY.'}],stream:false};
      if(draft.provider==='groq'){
        body.max_completion_tokens=128;
        if(draft.model.startsWith('openai/gpt-oss-'))body.include_reasoning=false;
      }else body.max_tokens=128;
      const headers={'Content-Type':'application/json'};
      if(hosted)headers.Authorization='Bearer '+draft.key.trim();
      const response=await fetch(endpointUrl(p.url),{method:'POST',headers,
        body:JSON.stringify(body),signal:controller.signal});
      const raw=await response.text();
      let data={};try{data=JSON.parse(raw)}catch{}
      if(!response.ok){
        const reason=String(data.error?.message||data.message||response.statusText||'Request rejected');
        throw new Error('HTTP '+response.status+': '+reason.slice(0,250).replaceAll(draft.key.trim()||'\u0000','[key]'));
      }
      const answer=data.choices?.[0]?.message?.content;
      if(typeof answer!=='string'||!answer.trim())
        throw new Error('The API responded but returned no text. Try another free model.');
      setTest({status:'ok',message:'Real model reply: '+answer.trim().slice(0,250)});
    }catch(error){
      const message=controller.signal.aborted?(draft.provider==='browser'?'Local test stopped. The model download may still finish and be cached.':'Connection timed out or cancelled.'):
        error instanceof TypeError?'Browser could not reach the provider. Check your network, endpoint and CORS settings.':
          String(error.message||error);
      setTest({status:'error',message});
    }finally{clearTimeout(timeout);if(testAbortRef.current===controller)testAbortRef.current=null;setTesting(false);}
  }
  return <div className="fixed inset-0 z-[60] flex items-end sm:items-center justify-center sm:p-5" role="dialog" aria-modal="true" aria-label="Grumpy robot free AI setup wizard">
    <div className="absolute inset-0 bg-black/80 backdrop-blur-sm" onClick={testing?undefined:onClose}/>
    <div className="relative flex flex-col w-full max-w-[650px] max-h-[96dvh] sm:max-h-[92dvh] overflow-hidden rounded-t-3xl sm:rounded-3xl border border-lime-600/40 bg-[#07100d] text-slate-100 shadow-2xl shadow-lime-950/50">
      <div className="absolute inset-0 pointer-events-none opacity-20" style={{backgroundImage:'linear-gradient(110deg, transparent 40%, #194f34 41%, transparent 42%),linear-gradient(#63f28e17 1px, transparent 1px),linear-gradient(90deg,#63f28e15 1px,transparent 1px)',backgroundSize:'100% 100%,28px 28px,28px 28px'}}/>
      <div className="relative px-4 sm:px-6 pt-4 pb-3 border-b border-lime-800/40 flex items-center justify-between gap-3">
        <div><div className="text-[10px] uppercase tracking-[.27em] text-lime-400 font-bold">Tight Arse AI · Guided setup</div><h2 className="text-xl font-black text-lime-100">FREE AI. NO NONSENSE.</h2></div>
        <button type="button" className="rounded-xl border border-emerald-800 p-2.5 hover:bg-emerald-950/80 text-slate-300 disabled:opacity-40" onClick={()=>{if(testing)testAbortRef.current?.abort();else onClose();}} aria-label={testing?'Cancel running test':'Close setup wizard'}><Icon name="x" size={19}/></button>
      </div>
      <div className="relative px-4 sm:px-6 pt-3 pb-2">
        <div className="grid grid-cols-5 gap-1.5">
          {labels.map((label,i)=><button type="button" key={label} disabled={step===5||testing||i>step||saved} onClick={()=>setStep(i)}
            className={'h-1.5 rounded-full '+(i<=step?'bg-lime-400':'bg-emerald-950 border border-emerald-800/50')}
            title={'Step '+(i+1)+': '+label} aria-label={'Step '+(i+1)+': '+label}/>)}
        </div>
        <div className="flex justify-between mt-1.5 text-[10px] text-emerald-300/80"><span>{step===5?'SETUP COMPLETE':'STEP '+(step+1)+' OF 5'}</span><span>{step===5?'Done':labels[step]}</span></div>
      </div>
      <div className="relative overflow-y-auto thin-scroll flex-1 px-4 sm:px-6 pb-4">
        <div className="flex items-center gap-3 my-2 sm:my-3">
          <div className="relative shrink-0 h-[98px] w-[100px] sm:w-[138px] sm:h-[138px] overflow-hidden rounded-2xl bg-[#071a10] border border-lime-700/30 shadow-inner shadow-emerald-900/50">
            {SIDEBAR_ROBOT_IMAGE?<img src={SIDEBAR_ROBOT_IMAGE} alt="Grumpy green Tight Arse AI robot" className="w-full h-full object-contain wizard-robot-bob" />:<Icon name="spark" size={38}/>}
          </div>
          <div className="relative flex-1 rounded-2xl rounded-bl-sm border border-emerald-700/65 bg-emerald-950/75 p-3 sm:p-4 shadow-lg">
            <div className="text-[9px] text-lime-400 uppercase tracking-wider font-bold mb-1">Your extremely unwilling assistant</div>
            <p className="text-sm sm:text-base text-lime-100 font-semibold leading-5 sm:leading-6" aria-live="polite">{sentences[step]}</p>
          </div>
        </div>
        {step===0&&<div className="space-y-3">
          <p className="text-sm text-slate-300">Choose a provider. We will guide you through its account, key, free-tier checks, model and a connection test.</p>
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
            {Object.entries(PROVIDERS).map(([id,p])=><button type="button" key={id} onClick={()=>choose(id)}
              aria-pressed={draft.provider===id}
              className={'text-left p-3 rounded-xl border transition-colors '+(draft.provider===id?'border-lime-400 bg-lime-600/15':'border-emerald-800/60 bg-slate-900/75 hover:border-emerald-500')}>
              <div className="flex items-center justify-between gap-2"><strong className="text-sm text-lime-100">{p.name}</strong><span className={'text-xs '+(draft.provider===id?'text-lime-300':'text-slate-600')}>{draft.provider===id?'✓ Selected':'○'}</span></div>
              <p className="text-xs leading-5 text-slate-400 mt-1">{WIZARD_GUIDES[id].tagline}</p>
            </button>)}
          </div>
          <p className="text-xs text-amber-200/90">Free tiers have limits. This app cannot guarantee zero bills if you link a paid account.</p>
        </div>}
        {step===1&&<div className="space-y-3">
          <div className="flex items-center justify-between gap-3">
            <div><h3 className="text-lg font-bold text-lime-100">Follow me. One click at a time.</h3>
              <p className="text-xs text-slate-400 mt-1">Action {guideIndex+1} of {tour.length} for {info.name}</p></div>
            {hosted&&<button type="button" className="text-[11px] shrink-0 text-lime-300 underline" onClick={()=>setStep(2)}>Already have a key?</button>}
          </div>
          <div className="flex gap-1" aria-label="Provider onboarding progress">
            {tour.map((s,i)=><button type="button" key={i} aria-label={'Show action '+(i+1)+': '+s.title}
              onClick={()=>{setGuideIndex(i);setGuideHelp(false)}}
              className={'h-1.5 rounded-full flex-1 '+(i===guideIndex?'bg-lime-300':guideCompleted[i]?'bg-emerald-500':'bg-slate-700')}/>)}
          </div>
          <div className="rounded-2xl border border-emerald-700/60 bg-slate-900/70 overflow-hidden">
            <div className="p-4 pb-3">
              <p className="text-[10px] text-emerald-300 uppercase font-bold tracking-widest mb-1">Action {guideIndex+1} · {info.name}</p>
              <h4 className="text-lg font-extrabold text-lime-100 leading-6">{action.title}</h4>
              <p className="text-sm text-slate-200 leading-6 mt-3">{action.instruction}</p>
              {action.code&&<div className="mt-3 p-2.5 rounded-lg bg-black/70 border border-emerald-800 flex items-center justify-between gap-2">
                <code className="font-mono text-xs sm:text-sm text-lime-200 break-all">{action.code}</code>
                <button type="button" className="btn btn-soft !py-1.5 !px-2.5 shrink-0" aria-label={'Copy '+action.code} onClick={()=>navigator.clipboard?.writeText(action.code)}><Icon name="copy" size={16}/></button>
              </div>}
            </div>
            <div className="px-4 pb-3">
              <p className="text-[10px] text-emerald-400 uppercase font-semibold tracking-widest mb-2">Where to go</p>
              <div className="flex flex-wrap items-center gap-1.5">
                {action.path.map((part,i)=><React.Fragment key={i}>{i>0&&<span className="text-emerald-600">›</span>}
                  <span className={'text-xs rounded-md border px-2 py-1.5 '+(i===action.path.length-1?'bg-lime-500/20 border-lime-500/60 text-lime-100 font-bold':'bg-slate-950 border-slate-700 text-slate-300')}>{part}</span>
                </React.Fragment>)}
              </div>
            </div>
            {action.url&&<a href={action.url} target="_blank" rel="noopener noreferrer"
              className="mx-4 mb-3 btn btn-primary flex justify-center items-center gap-2 !py-3">
              {action.link}<Icon name="arrow" size={16}/></a>}
            <div className="border-t border-emerald-800/60 p-3.5 space-y-2.5 bg-emerald-950/20">
              <div className="flex items-start gap-2"><Icon name="check" size={16} className="shrink-0 text-lime-300 mt-0.5"/>
                <p className="text-xs leading-5 text-emerald-100"><strong>What you should see:</strong> {action.look}</p></div>
              <div className="flex items-start gap-2"><Icon name="alert-triangle" size={16} className="shrink-0 text-amber-300 mt-0.5"/>
                <p className="text-xs leading-5 text-amber-100"><strong>Don't do this:</strong> {action.trap}</p></div>
            </div>
          </div>
          <button type="button" className="w-full text-left rounded-xl border border-slate-700 bg-slate-900/70 px-3 py-3 flex items-center justify-between gap-2 text-sm text-lime-200" onClick={()=>setGuideHelp(v=>!v)} aria-expanded={guideHelp}>
            <span>I'm stuck — I can't see that</span><Icon name="chevron" size={16}/>
          </button>
          {guideHelp&&<div className="rounded-xl border border-amber-800/60 bg-amber-950/20 p-3 text-xs leading-5 text-amber-100">
            {action.help}
            <p className="mt-2 text-slate-300">Provider websites change. These are guidance screens; we cannot see or click inside your provider account from this webpage.</p>
          </div>}
          <p className="text-xs text-slate-400 leading-5">Once you've done this on the provider site, return to this tab and tap <strong className="text-lime-300">Done, next action</strong>. The robot won't claim you did something it cannot verify.</p>
        </div>}
        {step===2&&<div className="space-y-3">
          <h3 className="text-lg font-bold text-lime-100">{hosted?'Paste your API key':draft.provider==='ollama'?'Connect your own Ollama server':draft.provider==='browser'?'No API key needed':'Nothing to configure'}</h3>
          {hosted?<React.Fragment>
            <p className="text-xs text-slate-300">Paste the key created for your <strong>free</strong> account or project. It will only be saved to this browser when you finish.</p>
            <div className="relative"><input className="field pr-14 font-mono text-sm" type={showKey?'text':'password'} value={draft.key} autoComplete="off" spellCheck={false} placeholder="Paste your free-tier API key" onChange={e=>change({key:e.target.value,confirmed:false})}/>
              <button type="button" className="absolute right-3 top-2.5 p-1 text-lime-300" onClick={()=>setShowKey(v=>!v)} aria-label="Show or hide API key"><Icon name={showKey?'eyeoff':'eye'} size={19}/></button>
            </div>
            <label className="flex gap-3 items-start rounded-xl border border-amber-600/50 bg-amber-950/25 p-3 cursor-pointer">
              <input className="h-4 w-4 mt-1 shrink-0 accent-lime-500" type="checkbox" checked={draft.confirmed} onChange={e=>change({confirmed:e.target.checked})}/>
              <span className="text-xs leading-5 text-amber-100"><strong>I checked my account.</strong> This key belongs to a genuine FREE-tier account/project with no billing-enabled project, paid plan, auto-top-up or auto-recharge. I know the app cannot verify my billing settings.</span>
            </label>
            <p className="text-[11px] leading-5 text-slate-400">Privacy: keys are stored in unencrypted browser localStorage after setup. Only use a trusted device. Never paste your key into a chat message.</p>
          </React.Fragment>:draft.provider==='ollama'?<React.Fragment>
            <label className="text-xs font-semibold text-slate-300 block">Private Ollama endpoint</label>
            <input className="field font-mono text-sm" value={draft.url} spellCheck={false} onChange={e=>change({url:e.target.value})} placeholder="http://localhost:11434/v1"/>
            <p className="text-xs text-amber-100 leading-5">Only localhost and private LAN hosts are allowed. If you are opening this website on your phone, use your PC’s LAN address, not localhost.</p>
          </React.Fragment>:draft.provider==='browser'?<p className="text-sm text-emerald-200">Your device will perform all AI inference through WebGPU. No key or account needed. The model downloads from public hosting; the first use can be large.</p>:<p className="text-sm text-emerald-200">The local demo needs no key or server. Continue to choose its simulated model.</p>}
        </div>}
        {step===3&&<div className="space-y-4">
          <h3 className="text-lg font-bold text-lime-100">Choose a model</h3>
          <p className="text-xs text-slate-300">Only models permitted by the app’s free-only filter are shown. You can discover more vetted models later under Settings → AI provider.</p>
          <div className="space-y-2">
            {models.map(([id,label])=><button type="button" key={id} onClick={()=>change({model:id})}
              aria-pressed={draft.model===id}
              className={'w-full text-left flex items-center gap-3 border rounded-xl px-3 py-3 '+(draft.model===id?'border-lime-400 bg-lime-500/15':'border-slate-700 bg-slate-900/70 hover:border-emerald-600')}>
              <span className={'w-4 h-4 rounded-full border-2 shrink-0 '+(draft.model===id?'border-lime-400 bg-lime-500':'border-slate-500')}/>
              <span className="text-sm text-slate-100 break-all">{label}</span>
            </button>)}
          </div>
          {draft.provider==='ollama'&&<div><label className="text-xs text-slate-300 block mb-2">Already-installed model name</label><input className="field font-mono text-sm" value={draft.model} spellCheck={false} onChange={e=>change({model:e.target.value})}/></div>}
          {draft.provider==='browser'&&<p className="text-xs text-emerald-200">Start with the 1B model, or choose SmolLM2 360M for low-memory devices. Downloads may be large and cached files can be evicted.</p>}
          {draft.provider==='openrouter'&&<p className="text-xs text-emerald-200">Tip: openrouter/free automatically picks an eligible free model. It is the simplest starting choice.</p>}
        </div>}
        {step===4&&<div className="space-y-4">
          <h3 className="text-lg font-bold text-lime-100">Test {info.name}</h3>
          <div className="rounded-xl border border-emerald-800/60 bg-slate-900/75 p-3 space-y-1.5 text-xs"><p><span className="text-slate-400">Provider:</span> {info.name}</p><p><span className="text-slate-400">Model:</span> <span className="break-all text-lime-200">{draft.model}</span></p><p className="text-slate-400">{draft.provider==='demo'?'No network calls will be made.':draft.provider==='browser'?'The model will download to your browser (first use) and then generate a real reply on this device. No inference API call.':'One short real inference request will be sent directly from your browser. It counts towards your allowance.'}</p></div>
          {draft.provider==='browser'&&localProgress.phase==='loading'&&<div className="rounded-xl border border-emerald-700/60 bg-emerald-950/25 p-3 space-y-2" role="status"><p className="text-xs text-lime-200 break-words">{localProgress.text}</p><div className="h-2 bg-slate-800 rounded-full overflow-hidden"><div className="bg-lime-400 h-full" style={{width:Math.round(localProgress.progress*100)+'%'}}/></div><p className="text-[10px] text-slate-400">{Math.round(localProgress.progress*100)}% · Keep this page open</p></div>}
          <button type="button" disabled={testing} onClick={runTest} className="btn btn-primary w-full justify-center py-3 text-sm">{testing?'Testing connection…':test.status==='error'?'Retry free test':'Run free connection test'}</button>
          {test.status!=='idle'&&<div className={'rounded-xl border p-3 text-xs leading-5 break-words '+(test.status==='ok'?'border-lime-600/60 bg-lime-950/30 text-lime-100':test.status==='error'?'border-amber-600/60 bg-amber-950/30 text-amber-100':'border-slate-700 bg-slate-900 text-slate-300')} role="status"><strong>{test.status==='ok'?'✓ Connection worked':test.status==='error'?'Could not verify':'Checking…'}</strong><p className="mt-1">{test.message}</p></div>}
          <p className="text-[11px] text-slate-400 leading-5">A successful test confirms this model answered once. It cannot prove your provider account will never charge. You can save without testing if browser restrictions prevent a test.</p>
        </div>}
        {step===5&&<div className="space-y-4">
          <div className="rounded-2xl border border-lime-500/50 bg-lime-500/10 p-5 text-center"><div className="text-4xl mb-2">{testedOnSave?'✓':'◌'}</div><h3 className="text-xl font-bold text-lime-100">{testedOnSave?'Connected and ready':'Settings saved'}</h3><p className="text-sm text-slate-300 mt-2">{info.name} is now selected with {draft.model}. {testedOnSave?'The live test returned a response.':'The connection was not verified; try a short chat message to check it.'}</p></div>
          <button type="button" className="btn btn-soft w-full justify-center" onClick={()=>{setStep(0);setTest({status:'idle',message:''});setSaved(false);setTestedOnSave(false);}}>Set up another free provider</button>
          <p className="text-center text-xs text-slate-400">You can reopen this robot at any time from Settings.</p>
        </div>}
      </div>
      <div className="relative flex items-center justify-between gap-2 border-t border-emerald-800/50 bg-[#091810] px-4 sm:px-6 py-3 safe-bottom">
        {step===5?<button type="button" className="btn btn-primary w-full justify-center py-3" onClick={onClose}>Start chatting</button>:<React.Fragment>
          <button type="button" className="btn btn-soft disabled:opacity-40" disabled={step===0||testing}
            onClick={()=>{if(step===1&&guideIndex>0){setGuideIndex(v=>v-1);setGuideHelp(false)}
              else if(step===2){setStep(1);setGuideIndex(tour.length-1);setGuideHelp(false)}
              else setStep(n=>n-1);}}>Back</button>
          <div className="flex gap-2 items-center">
            {step===1?<button type="button" className="btn btn-primary text-xs sm:text-sm" onClick={()=>{
              setGuideCompleted(previous=>({...previous,[guideIndex]:true}));
              if(guideIndex===tour.length-1)setStep(2);
              else{setGuideIndex(n=>n+1);setGuideHelp(false)}
            }}>{guideIndex===tour.length-1?'Done · Enter connection':'Done, next action'} <Icon name="chevron" size={15}/></button>:step===4?<React.Fragment>
              {test.status!=='ok'&&<button type="button" className="btn btn-soft text-xs" disabled={testing} onClick={()=>{try{saveConfiguration()}catch(e){setTest({status:'error',message:e.message||String(e)})}}}>Save untested</button>}
              {test.status==='ok'&&<button type="button" className="btn btn-primary" onClick={()=>{try{saveConfiguration()}catch(e){setTest({status:'error',message:e.message||String(e)})}}}>Finish setup</button>}
            </React.Fragment>:<button type="button" className="btn btn-primary" disabled={!allowed||testing} onClick={()=>setStep(n=>n+1)}>{step===0?'Get started':'Continue'}</button>}
          </div>
        </React.Fragment>}
      </div>
    </div>
  </div>;
}

function Settings({value,onChange,onClose,onOpenDiagnostics,onOpenWizard}) {
  const [settingsPage,setSettingsPage]=useState('home');
  const [hordeModels,setHordeModels]=useState([]);
  const [hordeDiscovery,setHordeDiscovery]=useState({loading:false,message:''});
  async function discoverHordeModels(){
    setHordeDiscovery({loading:true,message:'Loading available image models…'});
    try{
      const models=await fetchHordeModels({force:true});
      setHordeModels(models);
      setHordeDiscovery({loading:false,message:models.length+' models currently offered by volunteer workers.'});
    }catch(error){
      setHordeDiscovery({loading:false,message:'Discovery unavailable: '+String(error.message||error)+'. Basic fallback remains available.'});
    }
  }
  const patchImageHorde=changes=>onChange(previous=>({...previous,
    imageHorde:{...defaultImageHorde(),...(previous.imageHorde||{}),...changes}}));
  const sectionTitles={home:'Settings',provider:'AI provider',web:'Web search',images:'Image generation',advanced:'Advanced settings',safety:'Usage & safety'};
  const [showKey,setShowKey]=useState(false),[showSearchKey,setShowSearchKey]=useState(false);
  const [localState,setLocalState]=useState(browserModelStatus);
  const [gpuCheck,setGpuCheck]=useState({ok:null,text:'Checking device…'});
  const [localWork,setLocalWork]=useState(false),[localError,setLocalError]=useState('');
  useEffect(()=>subscribeBrowserModelStatus(setLocalState),[]);
  useEffect(()=>{
    if(value.provider!=='browser')return;
    let cancelled=false;checkBrowserWebGPU().then(result=>{if(!cancelled)setGpuCheck(result);});
    return ()=>{cancelled=true};
  },[value.provider]);
  async function prepareLocalModel(){
    setLocalWork(true);setLocalError('');
    try{await loadBrowserLLM(value.profiles.browser.model);}
    catch(error){setLocalError(String(error.message||error));}
    finally{setLocalWork(false);}
  }
  async function freeLocalMemory(){
    setLocalWork(true);setLocalError('');
    try{await unloadBrowserLLM();}
    catch(error){setLocalError(String(error.message||error));}
    finally{setLocalWork(false);}
  }
  const [loadingModels,setLoadingModels]=useState(false);
  const [modelError,setModelError]=useState('');
  const [discoveredAt,setDiscoveredAt]=useState(null);
  const provider=value.provider, info=PROVIDERS[provider],profile=value.profiles[provider];
  // Discovery replaces built-in suggestions, rather than extending them.
  // Built-ins remain only until a successful nonempty discovery.
  const discoveredModels=(Array.isArray(value.discoveredModels?.[provider])
    ?value.discoveredModels[provider]:[]).filter(id=>isApprovedModel(provider,id));
  const suggestedModels=info.models.filter(([id])=>isApprovedModel(provider,id)).map(([id,name])=>[id,name+' · FREE']);
  // A manually entered local Ollama model (or previously saved free model)
  // remains visible before discovery; never add it to a discovered list.
  if(!discoveredModels.length&&isApprovedModel(provider,profile.model)&&
      !suggestedModels.some(([id])=>id===profile.model))
    suggestedModels.push([profile.model,profile.model+' · selected']);
  const listedModels=discoveredModels.length
    ?discoveredModels.map(id=>[id,id+' · discovered'])
    :suggestedModels;
  const selectedModel=listedModels.some(([id])=>id===profile.model)
    ?profile.model:(listedModels[0]?.[0]||'');
  const patch=(values)=>onChange(s=>({...s,...values}));
  const patchProfile=(values)=>onChange(s=>({...s,profiles:{...s.profiles,[s.provider]:{...s.profiles[s.provider],...values}}}));
  const patchSearch=(values)=>onChange(s=>({...s,search:{...s.search,...values}}));
  const confirmed=!!value.freeTierConfirmed?.[provider];
  const providerStatus=provider==='demo'?'Demo mode'
    :provider==='browser'?(localState.phase==='ready'&&localState.model===profile.model?'Loaded on device':'WebGPU · load needed')
    :provider==='ollama'?'Local endpoint'
    :(profile.key?.trim()&&confirmed?'Key and free-tier declaration saved':'Needs configuration');
  const webStatus=!value.search.enabled?'Off'
    :(value.search.tavilyKey?.trim()&&value.search.tavilyFreeConfirmed?'On · configured':'On · setup needed');
  const imageStatus=value.imageHorde?.acknowledged?'Consent saved':'Consent needed';
  const updateConfirmation=checked=>onChange(s=>({...s,freeTierConfirmed:{...s.freeTierConfirmed,[provider]:checked}}));
  async function loadModels() {
    setLoadingModels(true);setModelError('');
    const discoveryTrace={chatId:null,turnId:null};
    const discoveryStart=performance.now();
    diagLog('normal','model-discovery-start',{provider,
      endpoint:provider==='gemini'?'native /v1beta/models':profile.url.replace(/\/+$/,'')+'/models'
    },discoveryTrace);
    try {
      if(provider==='demo'||provider==='browser')return;
      enforceFreeOnly(provider,profile,{...value,freeTierConfirmed:{...value.freeTierConfirmed,[provider]:true}});
      let candidates=[];
      if(provider==='gemini'){
        try{
          candidates=await listGeminiNativeModels(profile,discoveryTrace);
        }catch(nativeError){
          // Google also documents /v1beta/openai/models. If native
          // discovery cannot be used (e.g. browser CORS), fall back to its
          // OpenAI-compatible format without altering chat transport.
          diagLog('normal','gemini-discovery-native-fallback',{
            reason:String(nativeError.message||nativeError).slice(0,240)
          },discoveryTrace);
          const url=profile.url.replace(/\/+$/,'')+'/models';
          const res=await fetch(url,{headers:{Authorization:'Bearer '+profile.key.trim()}});
          diagLog('normal','model-discovery-http',{
            provider,endpoint:'openai-compatible /models',status:res.status,
            elapsedMs:Math.round(performance.now()-discoveryStart)
          },discoveryTrace);
          if(!res.ok)throw new Error('Google discovery failed: native '+nativeError.message+
            '; OpenAI-compatible HTTP '+res.status);
          const data=await res.json();
          candidates=Array.isArray(data.data)?data.data:(
            Array.isArray(data.models)?data.models:[]);
        }
      }else{
        const headers={};if(provider!=='ollama'&&profile.key.trim())headers.Authorization='Bearer '+profile.key.trim();
        const res=await fetch(profile.url.replace(/\/+$/,'')+'/models',{headers});
        diagLog('normal','model-discovery-http',{provider,status:res.status,elapsedMs:Math.round(performance.now()-discoveryStart)},discoveryTrace);
        if(!res.ok)throw new Error('HTTP '+res.status);
        const data=await res.json();
        candidates=Array.isArray(data.data)?data.data:(
          Array.isArray(data.models)?data.models:[]);
      }
      const models=candidates.map(m=>{
        if(typeof m==='string')m={id:m};
        const id=normaliseDiscoveredModelId(provider,m.id||m.name||m.model||m.baseModelId);
        if(!isApprovedModel(provider,id))return null;
        // Native Gemini listing can contain images, live audio and embedding
        // models. Only expose generation-capable text chat model IDs.
        if(provider==='gemini'&&Array.isArray(m.supportedGenerationMethods)&&
            !m.supportedGenerationMethods.includes('generateContent'))return null;
        if(provider==='openrouter'){
          // Free-variant suffix alone is not enough for discovery. Require explicit zero pricing.
          const prices=m.pricing;
          if(!prices||!Object.prototype.hasOwnProperty.call(prices,'prompt')||!Object.prototype.hasOwnProperty.call(prices,'completion'))return null;
          if(Object.values(prices).some(v=>v===null||v===undefined||!Number.isFinite(Number(v))||Number(v)!==0))return null;
          if(value.search.enabled&&(!Array.isArray(m.supported_parameters)||!m.supported_parameters.includes('tools')))return null;
        }
        return id;
      }).filter(Boolean);
      // Never insert built-in models into a successful API discovery result.
      const unique=[...new Set(models)].slice(0,300);
      diagLog('normal','model-discovery-filtered',{
        provider,candidates:candidates.length,eligible:unique.length,
        // No private credentials; IDs only, useful when providers rename models.
        rejectedExamples:candidates.map(m=>typeof m==='string'?m:(m.id||m.name||m.model||m.baseModelId||''))
          .filter(Boolean).filter(id=>!unique.includes(normaliseDiscoveredModelId(provider,id))).slice(0,8)
      },discoveryTrace);
      if(!unique.length)throw new Error(candidates.length
        ?'Provider returned '+candidates.length+' model(s), but none passed the verified free chat-model filter. See Diagnostics for returned model IDs.'
        :'Provider returned no models. The built-in suggestions remain available.');
      setDiscoveredAt(Date.now());
      // Keep the complete vetted discovery list for this provider across
      // Settings reopen/reloads. Change the actual selected model atomically.
      onChange(current=>({...current,
        discoveredModels:{...(current.discoveredModels||{}),[provider]:unique},
        profiles:{...current.profiles,[provider]:{...current.profiles[provider],
          model:unique.includes(current.profiles[provider].model)
            ?current.profiles[provider].model:unique[0]}}
      }));
      diagLog('normal','model-discovery-complete',{provider,freeModels:unique.length,selectedModel:unique.includes(profile.model)?profile.model:unique[0],elapsedMs:Math.round(performance.now()-discoveryStart)},discoveryTrace);
      diagLog('detailed','model-discovery-free-models',{models:unique},discoveryTrace);
      setModelError(`${unique.length} free-only model(s) available. Paid/unknown models were hidden.`);
    } catch(e) {
      diagLog('normal','model-discovery-error',{provider,message:e.message||String(e)},discoveryTrace);
      const message=String(e.message||e);
      const guidance=/none passed the verified free chat-model filter|returned no models/i.test(message)
        ?' · Existing model selections remain available.'
        :' · Check API key, endpoint access, browser CORS and free-tier project.';
      setModelError(message+guidance);
    }
    finally {setLoadingModels(false);}
  }
  return <div className="fixed inset-0 z-50 flex justify-center items-end sm:items-center sm:p-6" role="dialog" aria-modal="true" aria-label="Settings">
    <div className="absolute inset-0 bg-black/70" onClick={onClose}/>
    <div className="relative w-full sm:max-w-xl max-h-[94dvh] overflow-hidden flex flex-col rounded-t-3xl sm:rounded-3xl border border-slate-700 bg-slate-950 shadow-2xl safe-bottom">
      <div className="px-4 py-3.5 flex items-center justify-between gap-3 border-b border-emerald-800/50">
        <div className="flex items-center min-w-0 gap-2">
          {settingsPage!=='home'&&<button type="button" onClick={()=>setSettingsPage('home')}
            className="w-9 h-9 shrink-0 grid place-items-center rounded-lg border border-emerald-800/60 hover:bg-emerald-900/40"
            aria-label="Back to settings" title="Back to settings"><Icon name="back" size={19}/></button>}
          <div className="min-w-0">
            <h2 className="text-base sm:text-lg font-bold text-lime-100 leading-6">{sectionTitles[settingsPage]}</h2>
            <p className="text-[11px] text-emerald-300">FREE ONLY · no paid-model fallback</p>
          </div>
        </div>
        <button type="button" className="btn btn-soft shrink-0" onClick={onClose} aria-label="Close settings"><Icon name="x"/></button>
      </div>
      <div key={settingsPage} className="overflow-y-auto thin-scroll p-4 sm:p-5 space-y-5">
        {settingsPage==='home'&&<div className="space-y-4">
          <button type="button" onClick={onOpenWizard} className="w-full flex gap-3 items-center rounded-2xl border border-lime-500/60 bg-lime-500/10 px-3 py-3 text-left hover:bg-lime-500/20">
            {SIDEBAR_ROBOT_IMAGE&&<img src={SIDEBAR_ROBOT_IMAGE} alt="Grumpy robot" className="w-14 h-14 object-contain rounded-xl bg-[#071a10] shrink-0"/>}
            <span className="flex-1"><strong className="text-sm text-lime-100 block">Let the robot set it up</strong><span className="text-xs text-slate-300">Step-by-step free provider wizard · keys, models and test</span></span><Icon name="chevron" size={19}/>
          </button>
          <button type="button" onClick={()=>setSettingsPage('safety')}
            className="w-full flex gap-2.5 items-center rounded-xl border border-emerald-800/60 bg-emerald-950/20 px-3 py-3 text-left hover:bg-emerald-950/40">
            <Icon name="check" size={16} className="text-lime-300"/>
            <span className="flex-1 text-xs leading-5 text-emerald-100">
              <strong className="block text-lime-200">Free-only safeguards</strong>
              Provider account billing still needs your attention.
            </span>
            <Icon name="chevron" size={17} className="text-emerald-300"/>
          </button>
          <div className="space-y-2">
            <p className="text-[11px] uppercase tracking-widest font-semibold text-emerald-300">AI provider</p>
            <button type="button" onClick={()=>setSettingsPage('provider')}
              className="w-full rounded-xl border border-emerald-700/60 bg-slate-900/55 px-3.5 py-3 text-left hover:bg-emerald-950/30">
              <span className="flex items-center justify-between gap-2">
                <strong className="text-sm text-lime-100">{info.name}</strong>
                <span className="flex items-center gap-1 text-xs text-emerald-300">{providerStatus}<Icon name="chevron" size={17}/></span>
              </span>
              <span className="block mt-1.5 text-xs text-slate-300 break-all">{profile.model||'Choose a model'}</span>
              <span className="block mt-2 text-[11px] text-slate-400">Change provider, model or API key</span>
            </button>
          </div>
          <div className="space-y-2">
            <p className="text-[11px] uppercase tracking-widest font-semibold text-emerald-300">Services</p>
            <div className="rounded-xl border border-slate-700/80 bg-slate-900/50 divide-y divide-slate-700/60">
              <button type="button" onClick={()=>setSettingsPage('web')}
                className="w-full flex items-center gap-3 px-3.5 py-3 text-left hover:bg-emerald-950/30">
                <Icon name="globe" size={20} className="text-lime-300"/>
